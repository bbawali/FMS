<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>SHIKSHAYATAN — Tuition Fee Management</title>
<style>
/* =====================================================================
   SHIKSHAYATAN — Tuition Fee Management System
   Single-file, offline-first, LocalStorage-backed application
   ===================================================================== */
:root{
  --bg:#f4f6fb;
  --surface:#ffffff;
  --surface-2:#f8f9fc;
  --text:#1a2233;
  --muted:#67718c;
  --primary:#1e3a8a;
  --primary-dark:#132a63;
  --primary-light:#e8edfb;
  --accent:#b8892b;
  --accent-light:#fbf1de;
  --success:#0f8a4b;
  --success-light:#e6f7ee;
  --warning:#b45309;
  --warning-light:#fef3e2;
  --danger:#c0392b;
  --danger-light:#fdeceb;
  --border:#e4e8f1;
  --radius:16px;
  --radius-sm:10px;
  --shadow:0 2px 14px rgba(20,30,70,0.07);
  --shadow-lg:0 10px 40px rgba(20,30,70,0.18);
  --nav-h:64px;
}
[data-theme="dark"]{
  --bg:#0e1420;
  --surface:#161e2e;
  --surface-2:#1b2436;
  --text:#e8ecf6;
  --muted:#93a0bd;
  --primary:#4f6fd8;
  --primary-dark:#3854b5;
  --primary-light:#1c2742;
  --accent:#d9ae5c;
  --accent-light:#2c2517;
  --success:#22c07d;
  --success-light:#0f2a20;
  --warning:#e0a13a;
  --warning-light:#2e2312;
  --danger:#e2695c;
  --danger-light:#301716;
  --border:#263047;
  --shadow:0 2px 14px rgba(0,0,0,0.35);
  --shadow-lg:0 10px 40px rgba(0,0,0,0.55);
}
*{box-sizing:border-box;}
html,body{margin:0;padding:0;}
body{
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  background:var(--bg);
  color:var(--text);
  -webkit-font-smoothing:antialiased;
  padding-bottom:calc(var(--nav-h) + 14px);
  min-height:100vh;
  transition:background .2s ease,color .2s ease;
}
h1,h2,h3,h4{margin:0 0 4px 0;font-weight:700;}
p{margin:0;}
button{font-family:inherit;}
a{color:inherit;}
.hidden{display:none !important;}
.container{max-width:900px;margin:0 auto;padding:0 14px;}

/* ---------- Header ---------- */
.topbar{
  position:sticky;top:0;z-index:40;
  background:linear-gradient(135deg,var(--primary),var(--primary-dark));
  color:#fff;padding:14px 16px calc(14px + 14px) 16px;
  border-bottom-left-radius:22px;border-bottom-right-radius:22px;
  box-shadow:var(--shadow);
}
.topbar-row{display:flex;align-items:center;justify-content:space-between;gap:10px;}
.brand{display:flex;flex-direction:column;line-height:1.15;}
.brand .name{font-size:20px;font-weight:800;letter-spacing:.5px;}
.brand .sub{font-size:11px;opacity:.85;font-weight:500;}
.topbar-actions{display:flex;gap:8px;align-items:center;}
.icon-btn{
  width:38px;height:38px;border-radius:50%;border:none;background:rgba(255,255,255,.16);
  color:#fff;display:flex;align-items:center;justify-content:center;cursor:pointer;font-size:17px;
}
.icon-btn:active{background:rgba(255,255,255,.3);}
.teacher-line{margin-top:8px;font-size:12.5px;opacity:.9;}
.search-wrap{margin-top:12px;position:relative;}
.search-wrap input{
  width:100%;padding:11px 14px 11px 38px;border-radius:12px;border:none;font-size:14px;
  background:rgba(255,255,255,.94);color:#20263a;
}
.search-wrap .sicon{position:absolute;left:12px;top:50%;transform:translateY(-50%);opacity:.55;}

.page-title{display:flex;align-items:center;gap:10px;margin:16px 0 10px;padding:0 2px;}
.page-title h2{font-size:19px;}
.back-btn{background:var(--surface);border:1px solid var(--border);width:34px;height:34px;border-radius:50%;display:flex;align-items:center;justify-content:center;cursor:pointer;color:var(--text);}

/* ---------- Cards / layout ---------- */
main{padding:12px 0 96px;}
.card{
  background:var(--surface);border-radius:var(--radius);padding:16px;box-shadow:var(--shadow);
  margin-bottom:12px;border:1px solid var(--border);
}
.card + .card{margin-top:0;}
.grid-2{display:grid;grid-template-columns:1fr 1fr;gap:10px;}
.grid-3{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;}
@media (max-width:420px){.grid-3{grid-template-columns:1fr 1fr;}}

.stat-card{padding:14px;border-radius:14px;background:var(--surface);box-shadow:var(--shadow);border:1px solid var(--border);}
.stat-card .label{font-size:11.5px;color:var(--muted);font-weight:600;text-transform:uppercase;letter-spacing:.4px;}
.stat-card .value{font-size:20px;font-weight:800;margin-top:4px;}
.stat-card.accent-primary{background:var(--primary-light);border-color:transparent;}
.stat-card.accent-success{background:var(--success-light);}
.stat-card.accent-warning{background:var(--warning-light);}
.stat-card.accent-danger{background:var(--danger-light);}

.section-heading{font-size:13px;font-weight:800;text-transform:uppercase;letter-spacing:.5px;color:var(--muted);margin:18px 2px 8px;}

.alert-banner{display:flex;align-items:center;gap:10px;padding:13px 14px;border-radius:14px;margin-bottom:10px;font-size:13.5px;font-weight:600;}
.alert-banner.warn{background:var(--warning-light);color:var(--warning);}
.alert-banner.danger{background:var(--danger-light);color:var(--danger);}
.alert-banner.success{background:var(--success-light);color:var(--success);}
.alert-banner .go{margin-left:auto;background:none;border:none;font-weight:800;color:inherit;cursor:pointer;font-size:13px;text-decoration:underline;}

.quick-actions{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;}
@media (max-width:420px){.quick-actions{grid-template-columns:repeat(3,1fr);}}
.qa-btn{
  background:var(--surface);border:1px solid var(--border);border-radius:14px;padding:12px 6px;
  display:flex;flex-direction:column;align-items:center;gap:6px;cursor:pointer;box-shadow:var(--shadow);
  font-size:11.5px;font-weight:700;color:var(--text);text-align:center;
}
.qa-btn .qi{width:34px;height:34px;border-radius:10px;background:var(--primary-light);color:var(--primary);display:flex;align-items:center;justify-content:center;font-size:16px;}
[data-theme="dark"] .qa-btn .qi{color:#a9bbf5;}

/* ---------- Buttons ---------- */
.btn{
  display:inline-flex;align-items:center;justify-content:center;gap:6px;
  padding:12px 16px;border-radius:12px;border:none;font-size:14px;font-weight:700;
  cursor:pointer;min-height:44px;line-height:1;
}
.btn-primary{background:var(--primary);color:#fff;}
.btn-primary:active{background:var(--primary-dark);}
.btn-accent{background:var(--accent);color:#fff;}
.btn-success{background:var(--success);color:#fff;}
.btn-danger{background:var(--danger);color:#fff;}
.btn-outline{background:transparent;border:1.5px solid var(--border);color:var(--text);}
.btn-ghost{background:var(--surface-2);color:var(--text);}
.btn-wa{background:#25D366;color:#fff;}
.btn-block{width:100%;}
.btn-sm{padding:8px 12px;font-size:12.5px;min-height:36px;border-radius:10px;}
.btn[disabled]{opacity:.5;cursor:not-allowed;}
.btn-row{display:flex;gap:8px;flex-wrap:wrap;}
.fab{
  position:fixed;right:16px;bottom:calc(var(--nav-h) + 18px);z-index:45;
  width:56px;height:56px;border-radius:50%;background:var(--accent);color:#fff;border:none;
  box-shadow:var(--shadow-lg);font-size:26px;display:flex;align-items:center;justify-content:center;cursor:pointer;
}

/* ---------- Forms ---------- */
.field{margin-bottom:14px;}
.field label{display:block;font-size:12.5px;font-weight:700;color:var(--muted);margin-bottom:6px;}
.field .req{color:var(--danger);}
.field input,.field select,.field textarea{
  width:100%;padding:12px 13px;border-radius:11px;border:1.5px solid var(--border);
  background:var(--surface-2);color:var(--text);font-size:14.5px;
}
.field input:focus,.field select:focus,.field textarea:focus{outline:none;border-color:var(--primary);}
.field textarea{resize:vertical;min-height:70px;}
.field .hint{font-size:11.5px;color:var(--muted);margin-top:5px;}
.field .error{font-size:11.5px;color:var(--danger);margin-top:5px;font-weight:600;}
.toggle-row{display:flex;align-items:center;justify-content:space-between;padding:12px 14px;background:var(--surface-2);border-radius:12px;margin-bottom:14px;}
.toggle-row .t-label{font-weight:700;font-size:13.5px;}
.toggle-row .t-sub{font-size:11.5px;color:var(--muted);margin-top:2px;}
.switch{position:relative;width:46px;height:26px;flex:none;}
.switch input{opacity:0;width:0;height:0;}
.slider{position:absolute;inset:0;background:var(--border);border-radius:20px;cursor:pointer;transition:.2s;}
.slider:before{content:"";position:absolute;width:20px;height:20px;left:3px;top:3px;background:#fff;border-radius:50%;transition:.2s;}
.switch input:checked + .slider{background:var(--success);}
.switch input:checked + .slider:before{transform:translateX(20px);}
.segmented{display:flex;background:var(--surface-2);border-radius:11px;padding:4px;gap:4px;}
.segmented button{flex:1;border:none;background:transparent;padding:9px 4px;border-radius:8px;font-size:12.5px;font-weight:700;color:var(--muted);cursor:pointer;}
.segmented button.active{background:var(--surface);color:var(--primary);box-shadow:var(--shadow);}

/* ---------- Badges ---------- */
.badge{display:inline-flex;align-items:center;gap:5px;padding:4px 10px;border-radius:20px;font-size:11px;font-weight:800;letter-spacing:.2px;white-space:nowrap;}
.badge.PAID,.badge.ACTIVE{background:var(--success-light);color:var(--success);}
.badge.DUE_TODAY{background:var(--warning-light);color:var(--warning);}
.badge.OVERDUE{background:var(--danger-light);color:var(--danger);}
.badge.PARTIALLY_PAID{background:#eef0fb;color:#5145cd;}
[data-theme="dark"] .badge.PARTIALLY_PAID{background:#232a4d;color:#aab0ff;}
.badge.UPCOMING{background:var(--accent-light);color:var(--accent);}
.badge.ADVANCE_PAID{background:var(--primary-light);color:var(--primary);}
[data-theme="dark"] .badge.ADVANCE_PAID{color:#a9bbf5;}
.badge.INACTIVE{background:var(--surface-2);color:var(--muted);}

/* ---------- Lists (student / payment cards) ---------- */
.list-item{background:var(--surface);border:1px solid var(--border);border-radius:14px;padding:13px 14px;margin-bottom:10px;box-shadow:var(--shadow);cursor:pointer;}
.li-top{display:flex;justify-content:space-between;align-items:flex-start;gap:8px;}
.li-name{font-size:15px;font-weight:800;}
.li-sub{font-size:12px;color:var(--muted);margin-top:2px;}
.li-row{display:flex;justify-content:space-between;align-items:center;margin-top:10px;font-size:12.5px;color:var(--muted);}
.li-amount{font-weight:800;color:var(--text);font-size:14px;}
.li-actions{display:flex;gap:6px;margin-top:10px;flex-wrap:wrap;}
.avatar{width:40px;height:40px;border-radius:50%;background:var(--primary-light);color:var(--primary);display:flex;align-items:center;justify-content:center;font-weight:800;font-size:15px;flex:none;}
[data-theme="dark"] .avatar{color:#a9bbf5;}
.li-head{display:flex;gap:10px;align-items:center;}

.filter-chips{display:flex;gap:8px;overflow-x:auto;padding:2px 2px 10px;}
.chip{flex:none;padding:8px 14px;border-radius:20px;background:var(--surface);border:1.5px solid var(--border);font-size:12.5px;font-weight:700;color:var(--muted);cursor:pointer;white-space:nowrap;}
.chip.active{background:var(--primary);color:#fff;border-color:var(--primary);}
.sort-row{display:flex;justify-content:flex-end;margin-bottom:8px;}

/* ---------- Empty state ---------- */
.empty-state{text-align:center;padding:44px 18px;color:var(--muted);}
.empty-state .ei{font-size:40px;margin-bottom:10px;}
.empty-state h3{color:var(--text);margin-bottom:6px;font-size:16px;}
.empty-state p{font-size:13px;margin-bottom:16px;}

/* ---------- Bottom nav ---------- */
.bottom-nav{
  position:fixed;left:0;right:0;bottom:0;height:var(--nav-h);background:var(--surface);
  border-top:1px solid var(--border);display:flex;z-index:50;box-shadow:0 -2px 14px rgba(20,30,70,.08);
}
.nav-item{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;background:none;border:none;color:var(--muted);font-size:10.5px;font-weight:700;cursor:pointer;}
.nav-item .ni{font-size:19px;}
.nav-item.active{color:var(--primary);}

/* ---------- Modal / bottom sheet ---------- */
.overlay{position:fixed;inset:0;background:rgba(10,14,26,.5);z-index:100;display:flex;align-items:flex-end;justify-content:center;}
@media (min-width:640px){.overlay{align-items:center;}}
.sheet{
  background:var(--surface);width:100%;max-width:560px;max-height:92vh;overflow-y:auto;
  border-radius:20px 20px 0 0;padding:18px 18px calc(18px + env(safe-area-inset-bottom,0px));
  animation:slideUp .18s ease-out;
}
@media (min-width:640px){.sheet{border-radius:20px;max-height:88vh;}}
@keyframes slideUp{from{transform:translateY(24px);opacity:0;}to{transform:translateY(0);opacity:1;}}
.sheet-handle{width:40px;height:4px;background:var(--border);border-radius:4px;margin:0 auto 14px;}
.sheet-header{display:flex;justify-content:space-between;align-items:center;margin-bottom:14px;}
.sheet-header h3{font-size:17px;}
.sheet-close{background:var(--surface-2);border:none;width:30px;height:30px;border-radius:50%;color:var(--text);cursor:pointer;font-size:15px;}
.sheet-footer{display:flex;gap:10px;margin-top:16px;position:sticky;bottom:0;background:var(--surface);padding-top:6px;}

/* ---------- Toast ---------- */
#toast-wrap{position:fixed;top:14px;left:0;right:0;display:flex;flex-direction:column;align-items:center;gap:8px;z-index:200;pointer-events:none;}
.toast{background:#20263a;color:#fff;padding:11px 18px;border-radius:12px;font-size:13.5px;font-weight:600;box-shadow:var(--shadow-lg);max-width:88%;text-align:center;}
.toast.success{background:var(--success);}
.toast.error{background:var(--danger);}

/* ---------- Receipt ---------- */
.receipt{background:var(--surface-2);border-radius:14px;padding:18px;border:1px dashed var(--border);}
.receipt-title{text-align:center;margin-bottom:10px;}
.receipt-title .b1{font-size:17px;font-weight:900;letter-spacing:1px;color:var(--primary);}
.receipt-title .b2{font-size:11.5px;color:var(--muted);font-weight:700;letter-spacing:1.5px;margin-top:2px;}
.receipt-row{display:flex;justify-content:space-between;padding:7px 0;font-size:13px;border-bottom:1px dashed var(--border);}
.receipt-row:last-child{border-bottom:none;}
.receipt-row .k{color:var(--muted);}
.receipt-row .v{font-weight:700;text-align:right;}
.receipt-total{margin-top:8px;padding-top:10px;border-top:2px solid var(--border);display:flex;justify-content:space-between;font-size:15px;font-weight:900;}

/* ---------- Misc ---------- */
.divider{height:1px;background:var(--border);margin:14px 0;}
.small-muted{font-size:11.5px;color:var(--muted);}
.progress-bar{height:8px;border-radius:6px;background:var(--surface-2);overflow:hidden;margin-top:6px;}
.progress-bar span{display:block;height:100%;background:var(--success);}
.bar-chart{display:flex;align-items:flex-end;gap:8px;height:120px;padding-top:10px;}
.bar-chart .bar-col{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;height:100%;}
.bar-chart .bar{width:100%;max-width:26px;background:var(--primary);border-radius:6px 6px 0 0;min-height:3px;}
.bar-chart .bar-label{font-size:9.5px;color:var(--muted);margin-top:5px;font-weight:700;}
.bar-chart .bar-val{font-size:9.5px;font-weight:800;margin-bottom:3px;}
table.plain{width:100%;border-collapse:collapse;font-size:12.5px;}
table.plain th{text-align:left;color:var(--muted);font-size:10.5px;text-transform:uppercase;padding:6px 4px;border-bottom:1px solid var(--border);}
table.plain td{padding:8px 4px;border-bottom:1px solid var(--border);}

@media print{
  body *{visibility:hidden;}
  #print-area, #print-area *{visibility:visible;}
  #print-area{position:absolute;top:0;left:0;width:100%;padding:20px;}
  .no-print{display:none !important;}
}
</style>
</head>
<body>

<div id="toast-wrap"></div>
<div id="modal-root"></div>

<header class="topbar">
  <div class="topbar-row">
    <div class="brand">
      <span class="name">SHIKSHAYATAN</span>
      <span class="sub">Tuition Fee Management</span>
    </div>
    <div class="topbar-actions">
      <button class="icon-btn no-print" data-action="toggle-theme" title="Toggle theme">🌓</button>
      <button class="icon-btn no-print" data-action="go" data-view="notifications" title="Notifications">🔔</button>
    </div>
  </div>
  <div class="teacher-line no-print">Teacher: <strong id="teacher-name-header">Shreyasi Bera</strong></div>
  <div class="search-wrap no-print" id="global-search-wrap">
    <span class="sicon">🔎</span>
    <input type="text" id="global-search" placeholder="Search student, WhatsApp, parent, school…">
  </div>
</header>

<main class="container" id="app"></main>

<button class="fab no-print" id="fab-add-student" data-action="go" data-view="addStudent" title="Add Student">＋</button>

<nav class="bottom-nav no-print" id="bottom-nav">
  <button class="nav-item" data-action="go" data-view="dashboard"><span class="ni">🏠</span>Dashboard</button>
  <button class="nav-item" data-action="go" data-view="students"><span class="ni">🎓</span>Students</button>
  <button class="nav-item" data-action="go" data-view="due"><span class="ni">⏰</span>Due</button>
  <button class="nav-item" data-action="go" data-view="payments"><span class="ni">💳</span>Payments</button>
  <button class="nav-item" data-action="open-more"><span class="ni">☰</span>More</button>
</nav>

<div id="print-area"></div>

<script>
/* =====================================================================
   CONFIG
   ===================================================================== */
const STORAGE_KEYS = {
  students:'shikshayatan_students',
  payments:'shikshayatan_payments',
  settings:'shikshayatan_settings',
  metadata:'shikshayatan_metadata'
};
const DEFAULT_SETTINGS = {
  teacherName:'Shreyasi Bera',
  brandName:'Shikshayatan',
  currency:'INR',
  defaultPaymentMethod:'Cash',
  theme:'light',
  templates:{
    joining:"Dear {{parentName}},\n\nThis is to confirm that *{{studentName}}* has joined *{{brandName}}* tuition classes from {{joiningDate}}.\n\nStudent: {{studentName}}\nJoining Date: {{joiningDate}}\nMonthly Tuition Fee: ₹{{amount}}\nFirst Fee Period: {{feePeriod}}\nFirst Fee Status: Paid\nNext Fee Due Date: {{dueDate}}\n\nThank you for choosing {{brandName}}.\n\nRegards,\n{{teacherName}}\n{{brandName}}",
    reminder:"Dear {{parentName}},\n\nThis is a gentle reminder regarding the tuition fee of *{{studentName}}* for {{feePeriod}}.\n\nFee Amount: ₹{{amount}}\nDue Date: {{dueDate}}\nStatus: {{status}}{{overdueLine}}\n\nKindly make the payment at your convenience.\n\nThank you.\n\nRegards,\n{{teacherName}}\n{{brandName}}",
    receipt:"*{{brandName}}*\n*TUITION FEE PAYMENT RECEIPT*\n\nStudent: {{studentName}}\n\nFee Period: {{feePeriod}}\nPayment Date: {{paymentDate}}\n\nAmount Paid: ₹{{amount}}\nPayment Method: {{method}}\n\nReceipt No: {{receiptNumber}}\n\nNext Fee Due Date: {{dueDate}}\n\nThank you for the payment.\n\nRegards,\n*{{teacherName}}*\n*{{brandName}}*"
  },
  metadata:{ lastReceiptSeq:0 }
};

/* =====================================================================
   DATA STORAGE LAYER
   ===================================================================== */
let STUDENTS = [];
let PAYMENTS = [];
let SETTINGS = JSON.parse(JSON.stringify(DEFAULT_SETTINGS));

function loadAll(){
  try{ STUDENTS = JSON.parse(localStorage.getItem(STORAGE_KEYS.students)) || []; }catch(e){ STUDENTS = []; }
  try{ PAYMENTS = JSON.parse(localStorage.getItem(STORAGE_KEYS.payments)) || []; }catch(e){ PAYMENTS = []; }
  try{
    const s = JSON.parse(localStorage.getItem(STORAGE_KEYS.settings));
    SETTINGS = s ? Object.assign({}, DEFAULT_SETTINGS, s, {templates:Object.assign({},DEFAULT_SETTINGS.templates,(s&&s.templates)||{})}) : JSON.parse(JSON.stringify(DEFAULT_SETTINGS));
  }catch(e){ SETTINGS = JSON.parse(JSON.stringify(DEFAULT_SETTINGS)); }
}
function saveStudents(){ localStorage.setItem(STORAGE_KEYS.students, JSON.stringify(STUDENTS)); }
function savePayments(){ localStorage.setItem(STORAGE_KEYS.payments, JSON.stringify(PAYMENTS)); }
function saveSettings(){ localStorage.setItem(STORAGE_KEYS.settings, JSON.stringify(SETTINGS)); }

function getStudents(){ return STUDENTS; }
function getStudentById(id){ return STUDENTS.find(s=>s.id===id); }
function getPayments(){ return PAYMENTS; }
function getPaymentsForStudent(id){ return PAYMENTS.filter(p=>p.studentId===id); }

/* =====================================================================
   UTILITIES — dates, currency, ids
   ===================================================================== */
function uid(prefix){ return prefix+'_'+Date.now().toString(36)+Math.random().toString(36).slice(2,8); }
function pad2(n){ return String(n).padStart(2,'0'); }
function toISODate(d){ return d.getFullYear()+'-'+pad2(d.getMonth()+1)+'-'+pad2(d.getDate()); }
function parseISODate(str){ if(!str) return null; const [y,m,d] = str.split('-').map(Number); return new Date(y, m-1, d); }
function todayDate(){ const d = new Date(); return new Date(d.getFullYear(), d.getMonth(), d.getDate()); }
function todayISO(){ return toISODate(todayDate()); }
const MONTH_NAMES = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
function formatDate(input){
  if(!input) return '—';
  const d = (input instanceof Date) ? input : parseISODate(input);
  if(!d || isNaN(d.getTime())) return '—';
  return pad2(d.getDate())+' '+MONTH_NAMES[d.getMonth()]+' '+d.getFullYear();
}
function formatMonthLabel(label){ // label = 'YYYY-MM'
  if(!label) return '—';

function daysBetween(d1,d2){ return Math.round((d2 - d1) / 86400000); }
function isSameDay(d1,d2){ return d1.getFullYear()===d2.getFullYear() && d1.getMonth()===d2.getMonth() && d1.getDate()===d2.getDate(); }
const CURRENCY_FMT = new Intl.NumberFormat('en-IN', { style:'currency', currency:'INR', maximumFractionDigits:0 });

function escapeHtml(s){ return String(s==null?'':s).replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
function initials(name){ if(!name) return '?'; const parts = name.trim().split(/\s+/); return ((parts[0]||'')[0]+((parts[1]||'')[0]||'')).toUpperCase(); }

   ===================================================================== */
function normalizeWhatsapp(raw){
  if(!raw) return {valid:false, number:''};
  let digits = String(raw).replace(/[^\d+]/g,'');
  let hadPlus = digits.startsWith('+');
  digits = digits.replace(/\+/g,'');
  digits = digits.replace(/^0+(?=\d{10,})/,'');
  if(digits.startsWith('0091')) digits = digits.slice(4);
  if(digits.length === 10){ digits = '91'+digits; }
  else if(digits.length === 11 && digits.startsWith('0')){ digits = '91'+digits.slice(1); }
  else if(digits.length === 12 && digits.startsWith('91')){ /* ok */ }
  else if(digits.length === 13 && digits.startsWith('091')){ digits = '91'+digits.slice(3); }
  const rest = digits.slice(2);
  const valid = digits.length === 12 && digits.startsWith('91') && /^[6-9]\d{9}$/.test(rest);
  return {valid, number:digits};
}
function applyTemplate(tpl, vars){
  return String(tpl||'').replace(/\{\{(\w+)\}\}/g, (m,k)=> (vars[k]!==undefined && vars[k]!==null) ? vars[k] : '');
}

}

}

/* =====================================================================
   FEE CALCULATION ENGINE
   ===================================================================== */
function periodStartDate(student, k){
  const j = parseISODate(student.joiningDate);
  const targetIdx = j.getMonth() + k;
  const targetYear = j.getFullYear() + Math.floor(targetIdx/12);
  const targetMonth = ((targetIdx % 12) + 12) % 12;
  const day = j.getDate();
  const lastDay = new Date(targetYear, targetMonth+1, 0).getDate();
  return new Date(targetYear, targetMonth, Math.min(day, lastDay));
}
function periodLabelOf(date){ return date.getFullYear()+'-'+pad2(date.getMonth()+1); }

// Replays ALL payments (chronological) to derive, per period label, how much has
// been allocated. This is the single source of truth — nothing is stored twice.
function computeAllocations(student){
  const payments = getPaymentsForStudent(student.id)
    .slice()
    .sort((a,b)=> (a.paymentDate < b.paymentDate ? -1 : a.paymentDate > b.paymentDate ? 1 : (a.createdAt||'').localeCompare(b.createdAt||'')));
  const periodPaid = {};       // label -> amount allocated
  const paymentAllocMap = {};  // paymentId -> [{period,label,amount}]
  let k = 0;
  const fee = Number(student.monthlyFee)||0;
  for(const p of payments){
    let remaining = Number(p.amount)||0;
    const allocs = [];
    let guard = 0;
    while(remaining > 0.009 && guard < 1200){
      guard++;
      const due = periodStartDate(student, k);
      const label = periodLabelOf(due);
      const already = periodPaid[label] || 0;
      const shortfall = fee - already;
      if(shortfall <= 0.009){ k++; continue; }
      const alloc = Math.min(remaining, shortfall);
      periodPaid[label] = already + alloc;
      allocs.push({period:label, due, amount:alloc});
      remaining -= alloc;
      if(periodPaid[label] < fee - 0.009){ break; } // partially filled this period, stop (stay on same k next time)
      k++;
    }
    paymentAllocMap[p.id] = allocs;
  }
  return { periodPaid, paymentAllocMap };
}

// Determines current status of a student as of "today"
function calculateStudentStatus(student){
  const fee = Number(student.monthlyFee)||0;
  const { periodPaid } = computeAllocations(student);
  const today = todayDate();
  let k = 0, guard = 0;
  while(guard < 1200){
    guard++;
    const due = periodStartDate(student, k);
    const label = periodLabelOf(due);
    const paid = periodPaid[label] || 0;
    if(paid >= fee - 0.009){ k++; continue; }
    const outstanding = Math.max(0, fee - paid);
    let status, daysOverdue = 0;
    if(due <= today){
      if(isSameDay(due,today)) status = 'DUE_TODAY';
      else status = 'OVERDUE';
      if(due < today) daysOverdue = daysBetween(due, today);
      if(paid > 0.009) status = 'PARTIALLY_PAID';
    } else {
      const daysAway = daysBetween(today, due);
      if(paid > 0.009) status = 'PARTIALLY_PAID';
      else status = (daysAway <= 7) ? 'UPCOMING' : 'ACTIVE';
    }
    // detect advance paid beyond this: check if any future period already has allocation
    let hasAdvance = false;
    for(const lbl in periodPaid){
      const [yy,mm] = lbl.split('-').map(Number);
      const d = new Date(yy, mm-1, 1);
      if(d > due && periodPaid[lbl] > 0.009){ hasAdvance = true; break; }
    }
    return {
      status, currentPeriodLabel: label, currentPeriodDue: due,
      paidForCurrent: paid, outstandingCurrent: outstanding, daysOverdue,
      nextDueDate: due, hasAdvance
    };
  }
  // Fully paid for a very long horizon (shouldn't really hit) — treat as ADVANCE_PAID
  const due = periodStartDate(student, k);
  return { status:'ADVANCE_PAID', currentPeriodLabel:periodLabelOf(due), currentPeriodDue:due, paidForCurrent:0, outstandingCurrent:0, daysOverdue:0, nextDueDate:due, hasAdvance:true };
}

// Sum of ALL outstanding amounts for periods whose due date has already passed (<= today)
function calculateOutstandingTotal(student){
  const fee = Number(student.monthlyFee)||0;
  const { periodPaid } = computeAllocations(student);
  const today = todayDate();
  let total = 0, k = 0, guard = 0;
  while(guard < 1200){
    guard++;
    const due = periodStartDate(student, k);
    if(due > today) break;
    const label = periodLabelOf(due);
    const paid = periodPaid[label] || 0;
    total += Math.max(0, fee - paid);
    k++;
  }
  return total;
}

function getPaymentHistoryWithPeriods(student){
  const { paymentAllocMap } = computeAllocations(student);
  return getPaymentsForStudent(student.id)
    .slice()
    .sort((a,b)=> (a.paymentDate < b.paymentDate ? 1 : a.paymentDate > b.paymentDate ? -1 : (b.createdAt||'').localeCompare(a.createdAt||'')))
    .map(p=>({ payment:p, allocations: paymentAllocMap[p.id]||[] }));
}

function createStudent(data){
  const now = new Date().toISOString();
  const student = {
    id: uid('student'),

  };

function nextReceiptNumber(){

  saveSettings();
  const d = new Date();

}

  const now = new Date().toISOString();

    id: uid('payment'),
    studentId: data.studentId,
    amount: Number(data.amount),

    paymentMethod: data.paymentMethod || SETTINGS.defaultPaymentMethod,

  };

function computeDashboardStats(){
  const students = getStudents();
  const today = todayDate();
  const monthKey = today.getFullYear()+'-'+pad2(today.getMonth()+1);
  let feesCollectedThisMonth=0, feesDue=0, overdue=0, todaysCollections=0, newStudentsThisMonth=0, dueTodayCount=0, overdueCount=0;
  const totalStudents = students.length;
  const activeStudents = students.filter(s=>s.active!==false).length;

  PAYMENTS.forEach(p=>{
    if((p.paymentDate||'').slice(0,7)===monthKey) feesCollectedThisMonth += Number(p.amount)||0;
    if(p.paymentDate===todayISO()) todaysCollections += Number(p.amount)||0;
  });
  students.forEach(s=>{
    if((s.joiningDate||'').slice(0,7)===monthKey) newStudentsThisMonth++;
    const out = calculateOutstandingTotal(s);
    const info = calculateStudentStatus(s);
    if(out>0){
      feesDue += out;
      if(info.status==='OVERDUE') { overdue += out; overdueCount++; }
      if(info.status==='DUE_TODAY') dueTodayCount++;
    }
  });
  let totalDueThisPeriod=0, totalCollectedEver=0;
  PAYMENTS.forEach(p=> totalCollectedEver += Number(p.amount)||0);
  const collectionRate = (totalCollectedEver+feesDue) > 0 ? Math.round((totalCollectedEver/(totalCollectedEver+feesDue))*100) : 100;
  return {totalStudents,activeStudents,feesCollectedThisMonth,feesDue,overdue,todaysCollections,newStudentsThisMonth,collectionRate,dueTodayCount,overdueCount};
}

/* =====================================================================

   ===================================================================== */
function classifyStudentsForDue(){
  const groups = {OVERDUE:[], DUE_TODAY:[], UPCOMING:[], PARTIALLY_PAID:[]};
  getStudents().forEach(s=>{
    const info = calculateStudentStatus(s);
    if(groups[info.status]) groups[info.status].push({s,info});
  });
  Object.values(groups).forEach(arr=> arr.sort((a,b)=> a.info.nextDueDate - b.info.nextDueDate));
  return groups;
}
function dueCard(s, info){
  const outstanding = calculateOutstandingTotal(s);
  const lastP = getPaymentHistoryWithPeriods(s)[0];
  return `
  <div class="list-item" style="cursor:default;">
    <div class="li-top">
      <div class="li-head">
        <div class="avatar">${initials(s.name)}</div>
        <div><div class="li-name">${escapeHtml(s.name)}</div><div class="li-sub">${escapeHtml(s.className||s.school||'')}</div></div>
      </div>
      <span class="badge ${info.status}">${statusLabel(info.status)}</span>
    </div>
    <div class="li-row"><span>Fee Period</span><span>${formatMonthLabel(info.currentPeriodLabel)}</span></div>
    <div class="li-row"><span>Due Date</span><span>${formatDate(info.currentPeriodDue)}</span></div>
    ${info.daysOverdue>0?`<div class="li-row"><span>Days Overdue</span><span style="color:var(--danger);font-weight:800;">${info.daysOverdue}</span></div>`:''}
    <div class="li-row"><span>Monthly Fee</span><span>${formatCurrency(s.monthlyFee)}</span></div>
    <div class="li-row"><span>Outstanding</span><span class="li-amount" style="color:var(--danger);">${formatCurrency(outstanding)}</span></div>
    <div class="li-row"><span>Last Payment</span><span>${lastP?formatDate(lastP.payment.paymentDate)+' · '+formatCurrency(lastP.payment.amount):'—'}</span></div>

      <button class="btn btn-success btn-sm" data-action="collect-fee" data-id="${s.id}">💳 Collect Fee</button>
      <button class="btn btn-wa btn-sm" data-action="whatsapp-reminder" data-id="${s.id}">💬 Reminder</button>
      <button class="btn btn-outline btn-sm" data-action="go" data-view="studentProfile" data-id="${s.id}">👤 Profile</button>

  </div>`;

function renderDueFees(){
  const groups = classifyStudentsForDue();
  const total = groups.OVERDUE.length+groups.DUE_TODAY.length+groups.UPCOMING.length+groups.PARTIALLY_PAID.length;
  if(total===0){
    return `<div class="page-title"><h2>Due &amp; Overdue Fees</h2></div>
      <div class="empty-state"><div class="ei">🎉</div><h3>Great! No pending fees right now.</h3></div>`;

  const section = (title,arr,cls)=> arr.length ? `<div class="section-heading">${title} (${arr.length})</div>${arr.map(({s,info})=>dueCard(s,info)).join('')}` : '';
  return `
    <div class="page-title"><h2>Due &amp; Overdue Fees</h2></div>
    ${section('Overdue', groups.OVERDUE)}
    ${section('Due Today', groups.DUE_TODAY)}
    ${section('Partially Paid', groups.PARTIALLY_PAID)}

}

/* =====================================================================
   RENDER — REPORTS / ANALYTICS
   ===================================================================== */
function renderReports(){
  const now = todayDate();
  const sel = APP.reportMonth || (now.getFullYear()+'-'+pad2(now.getMonth()+1));
  APP.reportMonth = sel;
  const [ry, rm] = sel.split('-').map(Number);

  const monthPayments = PAYMENTS.filter(p=>(p.paymentDate||'').slice(0,7)===sel);
  const totalCollected = monthPayments.reduce((a,p)=>a+Number(p.amount||0),0);
  const byMethod = {Cash:0,UPI:0,'Bank Transfer':0,Other:0};
  monthPayments.forEach(p=>{ byMethod[p.paymentMethod] = (byMethod[p.paymentMethod]||0) + Number(p.amount||0); });
  const newAdmissions = getStudents().filter(s=>(s.joiningDate||'').slice(0,7)===sel);
  const newAdmFee = newAdmissions.reduce((a,s)=>a+Number(s.monthlyFee||0),0);

  let totalOutstanding=0, totalOverdue=0;
  getStudents().forEach(s=>{
    const out = calculateOutstandingTotal(s);
    if(out>0){ totalOutstanding += out; if(calculateStudentStatus(s).status==='OVERDUE') totalOverdue += out; }
  });
  const avgPayment = monthPayments.length ? totalCollected/monthPayments.length : 0;
  const collectionRate = (totalCollected+totalOutstanding)>0 ? Math.round((totalCollected/(totalCollected+totalOutstanding))*100) : 100;

  // last 6 months trend
  const trend = [];
  for(let i=5;i>=0;i--){
    const d = new Date(ry, rm-1-i, 1);
    const label = d.getFullYear()+'-'+pad2(d.getMonth()+1);
    const sum = PAYMENTS.filter(p=>(p.paymentDate||'').slice(0,7)===label).reduce((a,p)=>a+Number(p.amount||0),0);
    trend.push({label:MONTH_NAMES[d.getMonth()], sum});
  }
  const maxTrend = Math.max(1, ...trend.map(t=>t.sum));

  const admissionRows = newAdmissions.length===0 ? `<div class="small-muted">No new admissions this month.</div>` : newAdmissions.map(s=>`
    <div class="li-row"><span>${escapeHtml(s.name)} (${formatDate(s.joiningDate)})</span><span>${formatCurrency(s.monthlyFee)}</span></div>`).join('');

  return `
    <div class="page-title"><h2>Reports &amp; Analytics</h2></div>
    <div class="card">
      <div class="field" style="margin-bottom:0;"><label>Select Month</label>
        <input type="month" id="report-month" value="${sel}"></div>
    </div>
    <div class="grid-2">
      <div class="stat-card accent-success"><div class="label">Total Collected</div><div class="value">${formatCurrency(totalCollected)}</div></div>
      <div class="stat-card"><div class="label">Payments</div><div class="value">${monthPayments.length}</div></div>
      <div class="stat-card accent-warning"><div class="label">Total Outstanding</div><div class="value">${formatCurrency(totalOutstanding)}</div></div>
      <div class="stat-card accent-danger"><div class="label">Total Overdue</div><div class="value">${formatCurrency(totalOverdue)}</div></div>
      <div class="stat-card"><div class="label">Collection Rate</div><div class="value">${collectionRate}%</div></div>
      <div class="stat-card"><div class="label">Average Payment</div><div class="value">${formatCurrency(avgPayment)}</div></div>
    </div>

    <div class="section-heading">Collection by Method</div>
    <div class="card">
      ${Object.entries(byMethod).map(([m,v])=>`<div class="li-row"><span>${m}</span><span class="li-amount">${formatCurrency(v)}</span></div>`).join('')}
    </div>

    <div class="section-heading">Collection Trend (last 6 months)</div>
    <div class="card">
      <div class="bar-chart">
        ${trend.map(t=>`<div class="bar-col"><div class="bar-val">${t.sum>0?Math.round(t.sum/1000)+'k':''}</div><div class="bar" style="height:${Math.max(4,(t.sum/maxTrend)*100)}%"></div><div class="bar-label">${t.label}</div></div>`).join('')}
      </div>
    </div>

    <div class="section-heading">New Admissions — ${formatMonthLabel(sel)} (${newAdmissions.length})</div>
    <div class="card">
      ${admissionRows}
      ${newAdmissions.length?`<div class="divider"></div><div class="li-row"><span>Total New Monthly Recurring Fee</span><span class="li-amount">${formatCurrency(newAdmFee)}</span></div>`:''}
    </div>

    <div class="section-heading">Export</div>
    <div class="btn-row" style="margin-bottom:14px;">
      <button class="btn btn-outline" data-action="export-csv-students">⬇ Students CSV</button>
      <button class="btn btn-outline" data-action="export-csv-payments">⬇ Payments CSV</button>
    </div>
  `;
}

/* =====================================================================
   RENDER — NOTIFICATIONS / REMINDER CENTER
   ===================================================================== */
function renderNotifications(){
  const today = todayDate();
  const buckets = {dueToday:[], overdue:[], in3:[], in7:[]};
  getStudents().forEach(s=>{
    const info = calculateStudentStatus(s);
    if(info.status==='OVERDUE') buckets.overdue.push({s,info});
    else if(info.status==='DUE_TODAY') buckets.dueToday.push({s,info});
    else {
      const days = daysBetween(today, info.nextDueDate);
      if(days>=1 && days<=3) buckets.in3.push({s,info});
      else if(days>=4 && days<=7) buckets.in7.push({s,info});
    }
  });
  const total = buckets.dueToday.length+buckets.overdue.length+buckets.in3.length+buckets.in7.length;
  const row = ({s,info})=>`
    <div class="list-item" style="cursor:default;">
      <div class="li-top">
        <div><div class="li-name" style="font-size:14px;">${escapeHtml(s.name)}</div>
        <div class="li-sub">${formatDate(info.currentPeriodDue)} · ${formatCurrency(s.monthlyFee)}</div></div>
        <span class="badge ${info.status}">${statusLabel(info.status)}</span>
      </div>
      <div class="li-actions"><button class="btn btn-wa btn-sm" data-action="whatsapp-reminder" data-id="${s.id}">💬 Remind</button></div>
    </div>`;
  const section=(t,arr)=> arr.length?`<div class="section-heading">${t} (${arr.length})</div>${arr.map(row).join('')}`:'';
  return `
    <div class="page-title"><h2>Notifications</h2></div>
    ${total===0?`<div class="empty-state"><div class="ei">🔔</div><h3>Nothing needs attention</h3><p>Reminders are recalculated every time you open the app.</p></div>`:''}
    ${section('Overdue', buckets.overdue)}
    ${section('Due Today', buckets.dueToday)}
    ${section('Upcoming in 3 days', buckets.in3)}
    ${section('Upcoming in 7 days', buckets.in7)}
  `;
}

function getReceiptExtra(payment){
  const s = getStudentById(payment.studentId);
  const { paymentAllocMap } = computeAllocations(s);
  const allocs = paymentAllocMap[payment.id]||[];
  const feePeriodLabel = allocs.length ? allocs.map(a=>formatMonthLabel(a.period)).join(', ') : '—';
  const info = calculateStudentStatus(s);
  const priorOutstanding = Math.max(0, calculateOutstandingTotal(s)); // outstanding AFTER this payment (current state)
  return { s, allocs, feePeriodLabel, nextDueDate:info.nextDueDate, currentOutstanding:priorOutstanding };
}

/* =====================================================================

document.addEventListener('click', function(e){
  const el = e.target.closest('[data-action]');
  if(!el) return;
  const action = el.dataset.action;
  const id = el.dataset.id;

  switch(action){
    case 'go': go(el.dataset.view, {id}); break;
    case 'close-modal': closeModal(); break;
    case 'toggle-theme': toggleTheme(); break;
    case 'open-more': openMoreSheet(); break;
    case 'set-student-filter': APP.studentsFilter = el.dataset.filter; render(); break;

    case 'collect-fee': openCollectFeeModal(id); break;
    case 'view-receipt': openReceiptModal(id); break;
    case 'edit-payment': openEditPaymentModal(id); break;
    case 'delete-payment': {
      const p = PAYMENTS.find(x=>x.id===id);
      if(!p) return;
      const st = getStudentById(p.studentId);
      confirmDialog('Delete Payment?', `Are you sure you want to delete this payment?\n\nStudent: ${st?st.name:''}\nAmount: ${formatCurrency(p.amount)}\nDate: ${formatDate(p.paymentDate)}`, ()=>{
        deletePayment(id); showToast('Payment deleted','success'); render();
      }, {danger:true, confirmLabel:'Delete'});
      break;
    }
    case 'delete-student': {
      const s = getStudentById(id);
      if(!s) return;
      confirmDialog('Delete '+s.name+'?', 'This will permanently delete the student\'s profile and payment history from this device.', ()=>{
        deleteStudent(id); showToast('Student deleted','success'); go('students');
      }, {danger:true, confirmLabel:'Delete Permanently'});
      break;
    }
    case 'whatsapp-generic': {
      const s = getStudentById(id);
      if(!s) return;
      const norm = normalizeWhatsapp(s.whatsapp);
      openWhatsAppPreview(norm.valid?norm.number:'', 'Hello '+s.name+', this is '+SETTINGS.teacherName+' from '+SETTINGS.brandName+'.', 'Message '+s.name);
      break;
    }
    case 'whatsapp-reminder': {
      const s = getStudentById(id);
      if(!s) return;
      const norm = normalizeWhatsapp(s.whatsapp);
      openWhatsAppPreview(norm.valid?norm.number:'', buildReminderMessage(s), 'Fee Reminder — '+s.name);
      break;
    }
    case 'whatsapp-joining': {
      const s = getStudentById(id);
      if(!s) return;
      const norm = normalizeWhatsapp(s.whatsapp);
      openWhatsAppPreview(norm.valid?norm.number:'', buildJoiningMessage(s), 'Joining Confirmation — '+s.name);
      break;
    }
    case 'whatsapp-receipt': {
      const p = PAYMENTS.find(x=>x.id===id);
      if(!p) return;
      const { s, feePeriodLabel, nextDueDate } = getReceiptExtra(p);
      const norm = normalizeWhatsapp(s.whatsapp);
      const msg = buildReceiptMessage(p, s, {feePeriodLabel, nextDueDate});
      openWhatsAppPreview(norm.valid?norm.number:'', msg, 'Receipt — '+s.name);
      break;
    }
    case 'copy-receipt': {
      const p = PAYMENTS.find(x=>x.id===id);
      if(!p) return;
      const { s, feePeriodLabel, nextDueDate } = getReceiptExtra(p);
      const msg = buildReceiptMessage(p, s, {feePeriodLabel, nextDueDate});
      navigator.clipboard && navigator.clipboard.writeText(msg).then(()=>showToast('Receipt copied','success')).catch(()=>showToast('Could not copy','error'));
      break;
    }
    case 'print-receipt': {
      const p = PAYMENTS.find(x=>x.id===id);
      if(!p) return;
      const content = document.getElementById('receipt-content-'+id);
      if(content){ document.getElementById('print-area').innerHTML = content.outerHTML; window.print(); }
      break;
    }
    case 'export-backup': exportBackup(); break;
    case 'restore-backup': restoreBackupFromInput(); break;
    case 'export-csv-students': exportStudentsCSV(); break;
    case 'export-csv-payments': exportPaymentsCSV(); break;
    case 'clear-all-data': {
      confirmDialog('Clear All Data?', 'This will permanently delete ALL students, payments and settings from this device. This cannot be undone. Please export a backup first if unsure.', ()=>{
        STUDENTS=[]; PAYMENTS=[]; SETTINGS = JSON.parse(JSON.stringify(DEFAULT_SETTINGS));
        saveStudents(); savePayments(); saveSettings(); applyTheme();
        showToast('All data cleared','success'); go('dashboard');
      }, {danger:true, confirmLabel:'Clear Everything'});
      break;
    }
  }
});

function bindDynamicForms(){
  const sf = document.getElementById('student-form');
  if(sf){
    const feeToggle = sf.querySelector('[name="feeCollectedAtJoining"]');
    const methodField = document.getElementById('joining-method-field');
    if(feeToggle && methodField){
      const sync = ()=> methodField.style.display = feeToggle.checked ? '' : 'none';
      feeToggle.addEventListener('change', sync); sync();
    }
    sf.addEventListener('submit', function(e){
      e.preventDefault();
      const fd = new FormData(sf);
      const name = (fd.get('name')||'').trim();
      const joiningDate = fd.get('joiningDate');
      const monthlyFee = Number(fd.get('monthlyFee'));
      const waRaw = fd.get('whatsapp');
      const norm = normalizeWhatsapp(waRaw);
      const editingId = APP.view==='editStudent' ? APP.params.id : null;

      if(!name){ showToast('Please enter the student name','error'); return; }
      if(!norm.valid){ showToast('Please enter a valid WhatsApp number','error'); return; }
      if(!joiningDate){ showToast('Please select a joining date','error'); return; }
      if(!(monthlyFee>0)){ showToast('Monthly fee must be greater than 0','error'); return; }

      const dup = findDuplicateWhatsapp(norm.number, editingId);
      if(dup && !sf.dataset.dupConfirmed){
        document.getElementById('duplicate-warning').innerHTML = `<div class="alert-banner warn">A student with this WhatsApp number already exists (${escapeHtml(dup.name)}). Submit again to continue anyway.</div>`;
        sf.dataset.dupConfirmed = '1';
        return;
      }

      const payload = {
        name, whatsapp: norm.number, joiningDate, monthlyFee,
        parentName: fd.get('parentName'), school: fd.get('school'), className: fd.get('className'),
        address: fd.get('address'), notes: fd.get('notes')
      };

      if(editingId){
        confirmDialog('Save Changes?', 'Changing the joining date or monthly fee may affect future fee calculations. Continue?', ()=>{
          updateStudent(editingId, payload);
          showToast('Student updated','success');
          go('studentProfile', {id:editingId});
        });
      } else {
        payload.feeCollectedAtJoining = !!fd.get('feeCollectedAtJoining');
        payload.joiningPaymentMethod = fd.get('joiningPaymentMethod');
        const student = createStudent(payload);
        showToast('Student added successfully','success');
        showJoiningConfirmation(student);

    });
  }

  const stf = document.getElementById('settings-form');
  if(stf){

      document.getElementById('teacher-name-header').textContent = SETTINGS.teacherName;
      showToast('Settings saved','success');
    });
  }
  const tf = document.getElementById('templates-form');
  if(tf){

      e.preventDefault();

      SETTINGS.templates.joining = fd.get('joining');
      SETTINGS.templates.reminder = fd.get('reminder');
      SETTINGS.templates.receipt = fd.get('receipt');

  }
}

/* =====================================================================
   BACKUP / RESTORE / CSV EXPORT
   ===================================================================== */
function downloadFile(filename, content, mime){
  const blob = new Blob([content], {type:mime||'application/octet-stream'});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url; a.download = filename;
  document.body.appendChild(a); a.click(); document.body.removeChild(a);
  setTimeout(()=>URL.revokeObjectURL(url), 2000);
}
function exportBackup(){
  const data = { version:1, exportedAt:new Date().toISOString(), students:STUDENTS, payments:PAYMENTS, settings:SETTINGS };
  const d = new Date();
  const fname = 'shikshayatan-backup-'+d.getFullYear()+'-'+pad2(d.getMonth()+1)+'-'+pad2(d.getDate())+'.json';
  downloadFile(fname, JSON.stringify(data,null,2), 'application/json');
  showToast('Backup exported','success');
}
function restoreBackupFromInput(){
  const file = APP._restoreFile;
  if(!file){ showToast('Please choose a backup file first','error'); return; }
  const reader = new FileReader();
  reader.onload = function(e){
    let data;
    try{ data = JSON.parse(e.target.result); }catch(err){ showToast('Invalid backup file','error'); return; }
    if(!data || !Array.isArray(data.students) || !Array.isArray(data.payments)){
      showToast('Backup file structure is invalid','error'); return;
    }
    confirmDialog('Restore Backup?', 'Existing data on this device will be replaced with the contents of this backup file. This cannot be undone.', ()=>{
      STUDENTS = data.students; PAYMENTS = data.payments;
      if(data.settings) SETTINGS = Object.assign({}, DEFAULT_SETTINGS, data.settings, {templates:Object.assign({},DEFAULT_SETTINGS.templates,(data.settings.templates)||{})});
      saveStudents(); savePayments(); saveSettings(); applyTheme();
      showToast('Backup restored successfully','success');
      go('dashboard');
    }, {confirmLabel:'Restore'});
  };
  reader.readAsText(file);
}
function csvEscape(v){
  v = v===undefined||v===null ? '' : String(v);
  if(/[",\n]/.test(v)) v = '"'+v.replace(/"/g,'""')+'"';
  return v;
}
function exportStudentsCSV(){
  const header = ['Name','WhatsApp','Joining Date','Monthly Fee','Parent/Guardian','School','Class','Status','Outstanding'];
  const rows = getStudents().map(s=>{
    const info = calculateStudentStatus(s);
    return [s.name, '+'+s.whatsapp, s.joiningDate, s.monthlyFee, s.parentName, s.school, s.className, statusLabel(info.status), calculateOutstandingTotal(s)];
  });
  const csv = [header, ...rows].map(r=>r.map(csvEscape).join(',')).join('\r\n');
  downloadFile('shikshayatan-students-'+todayISO()+'.csv', '\ufeff'+csv, 'text/csv;charset=utf-8;');
  showToast('Students CSV exported','success');
}
function exportPaymentsCSV(){
  const header = ['Student','Amount','Payment Date','Method','Receipt No','Notes'];
  const rows = PAYMENTS.slice().sort((a,b)=>a.paymentDate.localeCompare(b.paymentDate)).map(p=>{
    const s = getStudentById(p.studentId);
    return [s?s.name:'(deleted)', p.amount, p.paymentDate, p.paymentMethod, p.receiptNumber, p.notes];
  });
  const csv = [header, ...rows].map(r=>r.map(csvEscape).join(',')).join('\r\n');
  downloadFile('shikshayatan-payments-'+todayISO()+'.csv', '\ufeff'+csv, 'text/csv;charset=utf-8;');
  showToast('Payments CSV exported','success');
}
