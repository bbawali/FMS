<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0F2A5C">
<meta name="description" content="Shikshayatan — offline tuition fee management for Shreyasi Bera.">
<title>Shikshayatan · Tuition Fee Management</title>
<style>
/* ============================================================
   SHIKSHAYATAN — design tokens
   ============================================================ */
:root{
  --navy:#0F2A5C; --navy-2:#173B7A; --ink:#0A1B3D; --gold:#C79A3A; --gold-soft:#F3E7CB;
  --paper:#F4F5F8; --card:#FFFFFF; --card-2:#FAFBFD;
  --text:#14213D; --muted:#5F6B85; --faint:#8A94AA; --line:#E3E7EF; --line-2:#EDF0F6;
  --ok:#0E7C4A; --ok-bg:#E6F4EC; --warn:#9A6400; --warn-bg:#FDF1DC;
  --bad:#B3261E; --bad-bg:#FCE9E7; --info:#0B4F9E; --info-bg:#E7F0FC;
  --plum:#6B3FA0; --plum-bg:#F0E9F9;
  --shadow:0 1px 2px rgba(16,32,64,.06), 0 6px 18px rgba(16,32,64,.07);
  --shadow-lg:0 10px 40px rgba(10,27,61,.22);
  --r-lg:18px; --r-md:14px; --r-sm:10px;
  --sans:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,"Noto Sans",sans-serif;
  --serif:"Iowan Old Style","Palatino Linotype",Palatino,Georgia,"Times New Roman",serif;
  --nav-h:64px;
}
html[data-theme="dark"]{
  --navy:#0C1A36; --navy-2:#16294F; --ink:#050D1F; --gold:#D9B15E; --gold-soft:#3A3117;
  --paper:#0B1225; --card:#141D33; --card-2:#111A2E;
  --text:#E8EDF7; --muted:#A3AFC6; --faint:#7E8AA3; --line:#25314C; --line-2:#1D2740;
  --ok:#57D399; --ok-bg:#12301F; --warn:#E6B34D; --warn-bg:#33280C;
  --bad:#FF8A80; --bad-bg:#3A1512; --info:#8FBBF5; --info-bg:#122744;
  --plum:#C4A6EE; --plum-bg:#241735;
  --shadow:0 1px 2px rgba(0,0,0,.4), 0 8px 24px rgba(0,0,0,.35);
  --shadow-lg:0 12px 44px rgba(0,0,0,.6);
}
*,*::before,*::after{box-sizing:border-box}
html,body{margin:0;padding:0}
body{
  background:var(--paper); color:var(--text); font-family:var(--sans);
  font-size:15px; line-height:1.5; -webkit-font-smoothing:antialiased;
  -webkit-tap-highlight-color:transparent; overscroll-behavior-y:none;
}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;border:none;background:none}
a{color:var(--navy-2)}
h1,h2,h3,h4{margin:0;font-weight:650;letter-spacing:-.01em}
.num{font-variant-numeric:tabular-nums;font-feature-settings:"tnum" 1}
:focus-visible{outline:3px solid var(--gold);outline-offset:2px;border-radius:6px}
@media (prefers-reduced-motion:reduce){*{animation-duration:.001ms!important;transition-duration:.001ms!important}}

/* ---------- app frame ---------- */
#app{min-height:100dvh;display:flex;flex-direction:column}
.topbar{
  position:sticky;top:0;z-index:40;background:linear-gradient(180deg,var(--navy) 0%,var(--navy) 62%,var(--navy-2) 100%);
  color:#fff;padding:calc(env(safe-area-inset-top) + 12px) 16px 14px;border-bottom:1px solid rgba(255,255,255,.08);
}
.topbar-row{display:flex;align-items:center;gap:12px}
.seal{
  width:38px;height:38px;flex:0 0 38px;border-radius:11px;border:1px solid rgba(199,154,58,.75);
  background:rgba(255,255,255,.06);display:grid;place-items:center;font-family:var(--serif);
  font-size:19px;color:var(--gold);line-height:1
}
.brandwrap{min-width:0;flex:1}
.brand{font-family:var(--serif);font-size:19px;letter-spacing:.14em;color:#fff;line-height:1.15}
.brand-sub{font-size:11.5px;color:#B9C6E4;letter-spacing:.05em;margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.icon-btn{
  width:40px;height:40px;border-radius:12px;display:grid;place-items:center;color:#fff;
  background:rgba(255,255,255,.10);flex:0 0 40px
}
.icon-btn:active{background:rgba(255,255,255,.2)}
.icon-btn svg{width:20px;height:20px}
.screen-title{font-size:22px;margin-top:14px;font-weight:650;letter-spacing:-.02em}
.screen-note{font-size:13px;color:#B9C6E4;margin-top:2px}
.back-btn{display:inline-flex;align-items:center;gap:6px;color:#C7D4EE;font-size:13.5px;margin-bottom:2px}
.back-btn svg{width:15px;height:15px}

main{flex:1;padding:16px 16px calc(var(--nav-h) + 34px + env(safe-area-inset-bottom));max-width:820px;width:100%;margin:0 auto}

/* ---------- bottom nav ---------- */
.bottomnav{
  position:fixed;left:0;right:0;bottom:0;z-index:45;display:grid;grid-template-columns:repeat(5,1fr);
  background:var(--card);border-top:1px solid var(--line);
  padding:6px 4px calc(6px + env(safe-area-inset-bottom));box-shadow:0 -2px 14px rgba(16,32,64,.06)
}
.navitem{display:flex;flex-direction:column;align-items:center;gap:3px;padding:6px 2px;border-radius:12px;color:var(--faint);font-size:10.5px;letter-spacing:.01em;min-height:52px;justify-content:center;position:relative}
.navitem svg{width:21px;height:21px}
.navitem.on{color:var(--navy-2)}
html[data-theme="dark"] .navitem.on{color:var(--gold)}
.navitem.on::before{content:"";position:absolute;top:0;width:26px;height:3px;border-radius:0 0 4px 4px;background:var(--gold)}
.navbrand{display:none}
.navitem .dot{position:absolute;top:5px;right:calc(50% - 18px);min-width:16px;height:16px;padding:0 4px;border-radius:9px;background:var(--bad);color:#fff;font-size:9.5px;display:grid;place-items:center;font-weight:700}

/* ---------- generic surfaces ---------- */
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r-lg);box-shadow:var(--shadow)}
.pad{padding:16px}
.stack{display:flex;flex-direction:column;gap:12px}
.row{display:flex;align-items:center;gap:10px}
.between{display:flex;align-items:center;justify-content:space-between;gap:10px}
.muted{color:var(--muted)}
.faint{color:var(--faint)}
.tiny{font-size:12px}
.sm{font-size:13px}
.center{text-align:center}
.hr{height:1px;background:var(--line-2);margin:14px 0}
.section-head{display:flex;align-items:baseline;justify-content:space-between;margin:22px 2px 10px}
.section-head h2{font-size:15.5px;letter-spacing:-.005em}
.section-head .link{font-size:13px;color:var(--navy-2);font-weight:600}
html[data-theme="dark"] .section-head .link{color:var(--gold)}

/* ---------- alert strip ---------- */
.alert{display:flex;gap:12px;align-items:flex-start;padding:14px;border-radius:var(--r-md);border:1px solid;margin-bottom:12px}
.alert.bad{background:var(--bad-bg);border-color:color-mix(in srgb,var(--bad) 30%,transparent);color:var(--bad)}
.alert.warn{background:var(--warn-bg);border-color:color-mix(in srgb,var(--warn) 32%,transparent);color:var(--warn)}
.alert.ok{background:var(--ok-bg);border-color:color-mix(in srgb,var(--ok) 28%,transparent);color:var(--ok)}
.alert .t{font-weight:650;font-size:14px}
.alert .b{font-size:12.5px;opacity:.92;margin-top:1px}
.alert button{font-size:12.5px;font-weight:650;padding:7px 12px;border-radius:9px;background:rgba(255,255,255,.65);color:inherit;border:1px solid currentColor;white-space:nowrap}
html[data-theme="dark"] .alert button{background:rgba(255,255,255,.08)}

/* ---------- stat grid ---------- */
.stats{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.stat{background:var(--card);border:1px solid var(--line);border-radius:var(--r-md);padding:13px 14px;box-shadow:var(--shadow)}
.stat .k{font-size:11.5px;color:var(--muted);letter-spacing:.01em}
.stat .v{font-size:21px;font-weight:680;margin-top:4px;letter-spacing:-.02em}
.stat .m{font-size:11.5px;color:var(--faint);margin-top:2px}
.stat.hero{grid-column:1/-1;background:linear-gradient(135deg,var(--navy) 0%,var(--navy-2) 100%);border-color:transparent;color:#fff}
.stat.hero .k{color:#BCCAE8}
.stat.hero .v{font-size:32px;color:#fff}
.stat.hero .m{color:#9FB2D8}
.stat .v.ok{color:var(--ok)} .stat .v.bad{color:var(--bad)} .stat .v.warn{color:var(--warn)}

/* ---------- quick actions ---------- */
.qa{display:grid;grid-template-columns:repeat(4,1fr);gap:9px}
.qa button{background:var(--card);border:1px solid var(--line);border-radius:var(--r-md);padding:12px 4px 10px;display:flex;flex-direction:column;align-items:center;gap:7px;font-size:11px;color:var(--text);box-shadow:var(--shadow);min-height:74px;justify-content:center;line-height:1.2;text-align:center}
.qa button:active{transform:scale(.97)}
.qa .ic{width:34px;height:34px;border-radius:11px;display:grid;place-items:center;background:var(--info-bg);color:var(--navy-2)}
html[data-theme="dark"] .qa .ic{color:var(--info)}
.qa .ic svg{width:18px;height:18px}
.qa .ic.gold{background:var(--gold-soft);color:#8A6A16}
html[data-theme="dark"] .qa .ic.gold{color:var(--gold)}

/* ---------- badges ---------- */
.badge{display:inline-flex;align-items:center;gap:5px;font-size:11px;font-weight:670;padding:4px 9px;border-radius:999px;border:1px solid;letter-spacing:.02em;white-space:nowrap}
.badge::before{content:"";width:6px;height:6px;border-radius:50%;background:currentColor;flex:0 0 6px}
.b-paid{color:var(--ok);background:var(--ok-bg);border-color:color-mix(in srgb,var(--ok) 26%,transparent)}
.b-due{color:var(--warn);background:var(--warn-bg);border-color:color-mix(in srgb,var(--warn) 30%,transparent)}
.b-over{color:var(--bad);background:var(--bad-bg);border-color:color-mix(in srgb,var(--bad) 26%,transparent)}
.b-up{color:var(--info);background:var(--info-bg);border-color:color-mix(in srgb,var(--info) 26%,transparent)}
.b-part{color:#A45B00;background:#FCEEDD;border-color:#F0CFA5}
html[data-theme="dark"] .b-part{color:#F0B36B;background:#37240D;border-color:#5A3B14}
.b-adv{color:var(--plum);background:var(--plum-bg);border-color:color-mix(in srgb,var(--plum) 28%,transparent)}
.b-plain{color:var(--muted);background:var(--line-2);border-color:var(--line)}

/* ---------- buttons ---------- */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:46px;padding:0 16px;border-radius:12px;font-size:14.5px;font-weight:650;background:var(--line-2);color:var(--text);border:1px solid var(--line);transition:transform .06s ease}
.btn:active{transform:scale(.985)}
.btn svg{width:17px;height:17px}
.btn-primary{background:var(--navy);color:#fff;border-color:var(--navy)}
html[data-theme="dark"] .btn-primary{background:var(--navy-2);border-color:#2C4A85}
.btn-gold{background:var(--gold);color:#2A1F05;border-color:var(--gold)}
.btn-wa{background:#25D366;color:#06331A;border-color:#1FB855}
.btn-danger{background:var(--bad-bg);color:var(--bad);border-color:color-mix(in srgb,var(--bad) 35%,transparent)}
.btn-ghost{background:transparent}
.btn-sm{min-height:38px;font-size:13px;padding:0 12px;border-radius:10px}
.btn-block{width:100%}
.btn[disabled]{opacity:.5;pointer-events:none}
.btn-row{display:flex;gap:8px}
.btn-row .btn{flex:1;min-width:0}

/* ---------- student / due cards ---------- */
.slist{display:flex;flex-direction:column;gap:10px}
.scard{background:var(--card);border:1px solid var(--line);border-radius:var(--r-lg);box-shadow:var(--shadow);overflow:hidden}
.scard-main{display:flex;gap:12px;padding:14px;align-items:flex-start;width:100%;text-align:left}
.avatar{width:42px;height:42px;flex:0 0 42px;border-radius:13px;display:grid;place-items:center;font-weight:680;font-size:15px;background:var(--info-bg);color:var(--navy-2);border:1px solid color-mix(in srgb,var(--navy-2) 14%,transparent)}
html[data-theme="dark"] .avatar{color:var(--info)}
.scard h3{font-size:15.5px;line-height:1.25}
.scard .sub{font-size:12.5px;color:var(--muted);margin-top:2px}
.scard .meta{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.kv{display:flex;justify-content:space-between;gap:12px;font-size:13px;padding:5px 0}
.kv .k{color:var(--muted);flex:0 0 auto}
.kv .v{text-align:right;font-weight:560}
.detail-grid{display:grid;grid-template-columns:1fr 1fr;gap:0 16px}
.scard-foot{display:flex;gap:8px;padding:10px 12px;border-top:1px solid var(--line-2);background:var(--card-2)}
.scard-foot .btn{flex:1;min-height:40px;font-size:13px;padding:0 8px}
.amt-strip{display:flex;justify-content:space-between;align-items:center;padding:10px 14px;background:var(--card-2);border-top:1px solid var(--line-2);border-bottom:1px solid var(--line-2)}
.amt-strip .lbl{font-size:11.5px;color:var(--muted)}
.amt-strip .val{font-size:17px;font-weight:680;letter-spacing:-.01em}

/* ---------- search + filters ---------- */
.search{position:relative;margin-bottom:12px}
.search input{width:100%;height:46px;border-radius:13px;border:1px solid var(--line);background:var(--card);padding:0 40px 0 40px;font-size:15px}
.search svg{position:absolute;left:13px;top:14px;width:18px;height:18px;color:var(--faint)}
.search .clr{position:absolute;right:8px;top:8px;width:30px;height:30px;border-radius:8px;display:grid;place-items:center;color:var(--faint)}
.chips{display:flex;gap:7px;overflow-x:auto;padding:2px 2px 10px;margin:0 -2px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{white-space:nowrap;font-size:12.5px;font-weight:600;padding:8px 13px;border-radius:999px;border:1px solid var(--line);background:var(--card);color:var(--muted)}
.chip.on{background:var(--navy);border-color:var(--navy);color:#fff}
html[data-theme="dark"] .chip.on{background:var(--gold);border-color:var(--gold);color:#221A05}
.chip .n{opacity:.7;margin-left:3px}

/* ---------- forms ---------- */
.field{margin-bottom:14px}
.field > label{display:block;font-size:12.5px;font-weight:620;color:var(--muted);margin-bottom:6px}
.field .req{color:var(--bad)}
.input,select.input,textarea.input{width:100%;min-height:46px;border-radius:12px;border:1px solid var(--line);background:var(--card);padding:11px 13px;font-size:15px;appearance:none}
textarea.input{min-height:88px;resize:vertical;line-height:1.45}
select.input{background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='%235F6B85' stroke-width='2.2' stroke-linecap='round'><path d='M6 9l6 6 6-6'/></svg>");background-repeat:no-repeat;background-position:right 12px center;background-size:18px;padding-right:38px}
.input:focus{border-color:var(--navy-2);outline:none;box-shadow:0 0 0 3px color-mix(in srgb,var(--navy-2) 16%,transparent)}
.input.err{border-color:var(--bad);background:color-mix(in srgb,var(--bad) 5%,var(--card))}
.err-txt{color:var(--bad);font-size:12px;margin-top:5px;display:none}
.err-txt.show{display:block}
.hint{font-size:12px;color:var(--faint);margin-top:5px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:0 12px}
.switch{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:12px 14px;border:1px solid var(--line);border-radius:12px;background:var(--card-2)}
.switch .t{font-size:14px;font-weight:600}
.switch .d{font-size:12px;color:var(--muted);margin-top:2px}
.toggle{width:50px;height:30px;flex:0 0 50px;border-radius:999px;background:var(--line);position:relative;transition:background .18s}
.toggle::after{content:"";position:absolute;top:3px;left:3px;width:24px;height:24px;border-radius:50%;background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.3);transition:transform .18s}
.toggle.on{background:var(--ok)}
.toggle.on::after{transform:translateX(20px)}
.seg{display:grid;grid-auto-flow:column;gap:6px;background:var(--line-2);padding:4px;border-radius:12px}
.seg button{padding:9px 6px;border-radius:9px;font-size:13px;font-weight:600;color:var(--muted)}
.seg button.on{background:var(--card);color:var(--text);box-shadow:var(--shadow)}

/* ---------- modal / sheet ---------- */
.scrim{position:fixed;inset:0;background:rgba(8,17,38,.55);z-index:60;display:flex;align-items:flex-end;justify-content:center;backdrop-filter:blur(2px);animation:fade .16s ease}
@keyframes fade{from{opacity:0}to{opacity:1}}
@keyframes rise{from{transform:translateY(22px)}to{transform:translateY(0)}}
.sheet{background:var(--paper);width:100%;max-width:640px;max-height:92dvh;border-radius:22px 22px 0 0;display:flex;flex-direction:column;animation:rise .2s cubic-bezier(.2,.8,.3,1);box-shadow:var(--shadow-lg)}
.sheet-head{padding:14px 16px 12px;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:12px;background:var(--card);border-radius:22px 22px 0 0;position:sticky;top:0;z-index:2}
.sheet-head h2{font-size:16.5px;flex:1;min-width:0}
.sheet-head .sub{font-size:12px;color:var(--muted);margin-top:1px;font-weight:400}
.sheet-body{padding:16px;overflow-y:auto;-webkit-overflow-scrolling:touch}
.sheet-foot{padding:12px 16px calc(12px + env(safe-area-inset-bottom));border-top:1px solid var(--line);background:var(--card);display:flex;gap:9px}
.sheet-foot .btn{flex:1}
.grab{width:38px;height:4px;border-radius:4px;background:var(--line);margin:8px auto -4px}
.sheet.full{max-height:100dvh;height:100dvh;border-radius:0}
.sheet.full .sheet-head{border-radius:0;padding-top:calc(14px + env(safe-area-inset-top))}
@media(min-width:700px){
  .scrim{align-items:center}
  .sheet{border-radius:20px;max-height:88dvh}
  .sheet-head{border-radius:20px 20px 0 0}
  .grab{display:none}
  .sheet.full{height:auto;max-height:88dvh;border-radius:20px}
  .sheet.full .sheet-head{border-radius:20px 20px 0 0;padding-top:14px}
}

/* ---------- toast ---------- */
#toastRoot{position:fixed;left:0;right:0;bottom:calc(var(--nav-h) + 16px + env(safe-area-inset-bottom));z-index:90;display:flex;flex-direction:column;align-items:center;gap:8px;pointer-events:none;padding:0 16px}
.toast{background:var(--ink);color:#fff;border-radius:13px;padding:12px 15px;font-size:13.5px;box-shadow:var(--shadow-lg);display:flex;gap:9px;align-items:center;max-width:440px;animation:rise .18s ease;border:1px solid rgba(255,255,255,.12)}
.toast svg{width:17px;height:17px;flex:0 0 17px}
.toast.ok svg{color:#5BE0A0} .toast.bad svg{color:#FF9C93}

/* ---------- receipt ---------- */
.receipt{background:#fff;color:#14213D;border-radius:16px;border:1px solid #E3E7EF;overflow:hidden;box-shadow:var(--shadow)}
.receipt-top{background:var(--navy);color:#fff;padding:18px;text-align:center;position:relative}
.receipt-top .b{font-family:var(--serif);font-size:20px;letter-spacing:.16em}
.receipt-top .t{font-size:11px;letter-spacing:.18em;color:var(--gold);margin-top:6px}
.receipt-body{padding:16px 18px}
.receipt .line{display:flex;justify-content:space-between;gap:14px;font-size:13.5px;padding:7px 0;border-bottom:1px dashed #E8EBF2}
.receipt .line:last-child{border-bottom:none}
.receipt .line .k{color:#5F6B85}
.receipt .line .v{font-weight:640;text-align:right}
.receipt .total{background:#F4F5F8;margin:12px -18px 0;padding:14px 18px;display:flex;justify-content:space-between;align-items:center;border-top:1px solid #E3E7EF}
.receipt .total .k{font-size:12.5px;color:#5F6B85}
.receipt .total .v{font-size:23px;font-weight:700;color:var(--navy)}
.receipt-foot{padding:14px 18px 18px;text-align:center;border-top:1px solid #E8EBF2}
.receipt-foot .sig{font-family:var(--serif);font-size:16px;margin-top:2px}
.receipt-foot .r{font-size:11px;color:#8A94AA;margin-top:8px}
.stampd{position:absolute;right:14px;top:14px;font-size:9.5px;letter-spacing:.14em;border:1px solid var(--gold);color:var(--gold);padding:3px 7px;border-radius:5px}

/* ---------- letter (joining confirmation) ---------- */
.letter{background:#fff;color:#14213D;border-radius:16px;border:1px solid #E3E7EF;padding:20px;box-shadow:var(--shadow)}
.letter .hd{text-align:center;border-bottom:2px solid var(--gold);padding-bottom:12px;margin-bottom:14px}
.letter .hd .b{font-family:var(--serif);font-size:21px;letter-spacing:.16em;color:var(--navy)}
.letter .hd .t{font-size:11px;letter-spacing:.14em;color:#5F6B85;margin-top:5px}
.letter p{font-size:13.5px;line-height:1.6}

.letter .kv .k,.receipt .kv .k{color:#5F6B85}
.letter .kv .v,.receipt .kv .v{color:#14213D}
.letter .hr,.receipt .hr{background:#E8EBF2}

/* ---------- charts ---------- */
.chart{width:100%;height:auto;display:block;overflow:visible}
.bar-row{display:flex;align-items:center;gap:10px;font-size:12.5px;padding:5px 0}
.bar-row .lbl{flex:0 0 78px;color:var(--muted)}

/* ---------- timeline / table ---------- */
.tl{position:relative;padding-left:22px}
.tl::before{content:"";position:absolute;left:6px;top:6px;bottom:6px;width:2px;background:var(--line)}
.tl-item{position:relative;padding:0 0 12px}
.tl-item::before{content:"";position:absolute;left:-20px;top:14px;width:10px;height:10px;border-radius:50%;background:var(--card);border:2.5px solid var(--ok)}

/* ---------- empty state ---------- */
.empty{text-align:center;padding:44px 20px}
.empty .ic{width:62px;height:62px;border-radius:20px;background:var(--line-2);display:grid;place-items:center;margin:0 auto 14px;color:var(--faint)}
.empty .ic svg{width:28px;height:28px}
.empty h3{font-size:16px;margin-bottom:6px}
.empty p{font-size:13.5px;color:var(--muted);max-width:280px;margin:0 auto 16px}

/* ---------- list rows (more / settings) ---------- */
.rows{background:var(--card);border:1px solid var(--line);border-radius:var(--r-lg);overflow:hidden;box-shadow:var(--shadow)}
.rowitem{display:flex;align-items:center;gap:13px;padding:14px 15px;width:100%;text-align:left;border-bottom:1px solid var(--line-2)}
.rowitem:last-child{border-bottom:none}
.rowitem .ic{width:34px;height:34px;flex:0 0 34px;border-radius:11px;display:grid;place-items:center;background:var(--info-bg);color:var(--navy-2)}
html[data-theme="dark"] .rowitem .ic{color:var(--info)}
.rowitem .ic svg{width:17px;height:17px}
.rowitem .t{flex:1;min-width:0}
.rowitem .t b{display:block;font-size:14.5px;font-weight:600}
.rowitem .t span{font-size:12.5px;color:var(--muted)}
.rowitem .chev{color:var(--faint);width:17px;height:17px;flex:0 0 17px}
.rowitem.danger .ic{background:var(--bad-bg);color:var(--bad)}
.rowitem.danger .t b{color:var(--bad)}

/* ---------- desktop ---------- */

/* ================================================================
   3. UTILITIES — date, money, ids, dom
   ================================================================ */

/** Today's date, from the device. Never hardcoded. */
function today() { const d = new Date(); return new Date(d.getFullYear(), d.getMonth(), d.getDate()); }
function toISO(d) {
  const p = n => String(n).padStart(2, "0");
  return d.getFullYear() + "-" + p(d.getMonth() + 1) + "-" + p(d.getDate());
}
function todayISO() { return toISO(today()); }
/** Parse "YYYY-MM-DD" as a local-midnight Date (avoids UTC shift bugs). */
function parseISO(s) {
  if (!s) return null;
  const m = String(s).slice(0, 10).split("-").map(Number);
  if (m.length !== 3 || m.some(isNaN)) return null;
  const d = new Date(m[0], m[1] - 1, m[2]);
  return isNaN(d.getTime()) ? null : d;
}
function isValidISO(s) {
  const d = parseISO(s);
  if (!d) return false;
  return toISO(d) === String(s).slice(0, 10);
}
const MONTHS = ["January","February","March","April","May","June","July","August","September","October","November","December"];
const MON3 = ["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"];

/** 06 Sep 2026 */
function fmtDate(iso) {
  const d = parseISO(iso); if (!d) return "—";
  return String(d.getDate()).padStart(2, "0") + " " + MON3[d.getMonth()] + " " + d.getFullYear();
}
function fmtDateLong(iso) {
  const d = parseISO(iso); if (!d) return "—";
  return d.getDate() + " " + MONTHS[d.getMonth()] + " " + d.getFullYear();
}
function daysInMonth(y, m) { return new Date(y, m + 1, 0).getDate(); }
/** Add n months to an ISO date, clamping the day to the last valid day of the target month. */
function addMonthsClamped(iso, n) {
  const d = parseISO(iso); if (!d) return null;
  const y = d.getFullYear(), m = d.getMonth(), day = d.getDate();
  const tm = m + n;
  const ty = y + Math.floor(tm / 12);
  const tmm = ((tm % 12) + 12) % 12;
  return toISO(new Date(ty, tmm, Math.min(day, daysInMonth(ty, tmm))));
}
/** Whole days from a -> b (b later = positive). */
function daysBetween(isoA, isoB) {
  const a = parseISO(isoA), b = parseISO(isoB);
  if (!a || !b) return 0;
  return Math.round((b - a) / 86400000);
}
/** "2026-06" from an ISO date */
function monthKeyOf(iso) { return String(iso).slice(0, 7); }
/** "June 2026" from "2026-06" */
function monthLabel(key) {
  if (!key) return "—";
  const [y, m] = key.split("-").map(Number);
  if (!y || !m) return "—";
  return MONTHS[m - 1] + " " + y;
}
function monthLabelShort(key) {
  const [y, m] = String(key).split("-").map(Number);
  return MON3[m - 1] + " " + String(y).slice(2);
}
function monthKeyAdd(key, n) {
  const [y, m] = key.split("-").map(Number);
  const t = (y * 12 + (m - 1)) + n;
  return Math.floor(t / 12) + "-" + String((t % 12) + 1).padStart(2, "0");
}
function currentMonthKey() { return monthKeyOf(todayISO()); }

/** ₹2,500 / ₹1,25,000 — Indian grouping */
function money(n) {
  const v = Number(n) || 0;
  try {
    return new Intl.NumberFormat("en-IN", { style: "currency", currency: "INR", maximumFractionDigits: v % 1 === 0 ? 0 : 2 }).format(v);
  } catch (e) {
    return "₹" + v.toFixed(0);
  }
}
function moneyPlain(n) {
  const v = Number(n) || 0;
  try { return new Intl.NumberFormat("en-IN", { maximumFractionDigits: 0 }).format(v); }
  catch (e) { return String(v); }
}

function uid(prefix) {
  const r = (typeof crypto !== "undefined" && crypto.getRandomValues)
    ? Array.from(crypto.getRandomValues(new Uint8Array(6))).map(b => b.toString(36)).join("")
    : Math.random().toString(36).slice(2, 10);
  return prefix + "_" + Date.now().toString(36) + "_" + r.replace(/[^a-z0-9]/g, "").slice(0, 8);
}

function esc(s) {
  return String(s == null ? "" : s)
    .replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;")
    .replace(/"/g, "&quot;").replace(/'/g, "&#39;");
}
function initials(name) {
  const parts = String(name || "").trim().split(/\s+/).filter(Boolean);
  if (!parts.length) return "?";
  if (parts.length === 1) return parts[0].slice(0, 2).toUpperCase();
  return (parts[0][0] + parts[parts.length - 1][0]).toUpperCase();
}
function $(sel, root) { return (root || document).querySelector(sel); }
function $$(sel, root) { return Array.prototype.slice.call((root || document).querySelectorAll(sel)); }
function plural(n, one, many) { return n + " " + (n === 1 ? one : (many || one + "s")); }
function debounce(fn, ms) { let t; return function () { const a = arguments, c = this; clearTimeout(t); t = setTimeout(() => fn.apply(c, a), ms); }; }

/** Normalise an Indian WhatsApp number to wa.me form: 91XXXXXXXXXX */
function normalizeWhatsApp(raw) {
  let s = String(raw || "").replace(/[^\d+]/g, "");
  s = s.replace(/(?!^)\+/g, "");
  if (s.startsWith("+")) s = s.slice(1);
  s = s.replace(/^0+/, "");
  if (s.length === 10) s = "91" + s;
  else if (s.length === 12 && s.startsWith("91")) { /* ok */ }
  else if (s.length === 13 && s.startsWith("911")) s = "91" + s.slice(3);
  return s;
}
function isValidWhatsApp(raw) {
  const n = normalizeWhatsApp(raw);
  if (n.startsWith("91")) { const local = n.slice(2); return /^[6-9]\d{9}$/.test(local); }
  return /^\d{8,15}$/.test(n);
}
function prettyPhone(raw) {
  const n = normalizeWhatsApp(raw);
  if (n.startsWith("91") && n.length === 12) return "+91 " + n.slice(2, 7) + " " + n.slice(7);
  return "+" + n;
}

/* ================================================================
   4. DATA STORAGE — single source of truth
   ================================================================ */
const DB = {
  _cache: { students: null, payments: null, settings: null, metadata: null },
  _read(key, fallback) {
    try {
      const raw = localStorage.getItem(key);
      if (!raw) return fallback;
      const v = JSON.parse(raw);
      return (v === null || v === undefined) ? fallback : v;
    } catch (e) {
      console.warn("Storage read failed for", key, e);
      return fallback;
    }
  },
  _write(key, value) {
    try { localStorage.setItem(key, JSON.stringify(value)); return true; }
    catch (e) {
      console.error("Storage write failed", e);
      toast("Could not save — device storage may be full.", "bad");
      return false;
    }
  },
  clearCache() { this._cache = { students: null, payments: null, settings: null, metadata: null }; }
};

function getStudents() {
  if (!DB._cache.students) {
    const list = DB._read(APP.keys.students, []);
    DB._cache.students = Array.isArray(list) ? list : [];
  }
  return DB._cache.students;
}
function saveStudents(list) {
  DB._cache.students = list;
  DB._write(APP.keys.students, list);
  touchMeta();
}
function getPayments() {
  if (!DB._cache.payments) {
    const list = DB._read(APP.keys.payments, []);
    DB._cache.payments = Array.isArray(list) ? list : [];
  }
  return DB._cache.payments;
}
function savePayments(list) {
  DB._cache.payments = list;
  DB._write(APP.keys.payments, list);
  touchMeta();
}
function getSettings() {
  if (!DB._cache.settings) {
    const s = DB._read(APP.keys.settings, {});
    const merged = Object.assign({}, DEFAULT_SETTINGS, s || {});
    merged.templates = Object.assign({}, DEFAULT_SETTINGS.templates, (s && s.templates) || {});
    DB._cache.settings = merged;
  }
  return DB._cache.settings;
}
function saveSettings(s) {
  DB._cache.settings = s;
  DB._write(APP.keys.settings, s);
}
function getMeta() {
  if (!DB._cache.metadata) {
    DB._cache.metadata = DB._read(APP.keys.metadata, { receiptCounter: 0, createdAt: new Date().toISOString(), lastBackupAt: null, version: APP.version });
  }
  return DB._cache.metadata;
}
function saveMeta(m) { DB._cache.metadata = m; DB._write(APP.keys.metadata, m); }
function touchMeta() { const m = getMeta(); m.updatedAt = new Date().toISOString(); DB._write(APP.keys.metadata, m); }

function getStudent(id) { return getStudents().find(s => s.id === id) || null; }
function getStudentPaymentHistory(studentId) {
  return getPayments()
    .filter(p => p.studentId === studentId)
    .sort((a, b) => (b.paymentDate || "").localeCompare(a.paymentDate || "") || (b.createdAt || "").localeCompare(a.createdAt || ""));
}
function getPayment(id) { return getPayments().find(p => p.id === id) || null; }

/** Human-readable receipt number: SHK-YYYYMMDD-0001 */
function nextReceiptNumber() {
  const m = getMeta();
  m.receiptCounter = (m.receiptCounter || 0) + 1;
  saveMeta(m);
  return "SHK-" + todayISO().replace(/-/g, "") + "-" + String(m.receiptCounter).padStart(4, "0");
}

/* ================================================================
   5. FEE ENGINE
   ------------------------------------------------------------
   Billing model:
     • Period 0 = the joining month, due ON the joining date
       (the teacher normally collects it in advance at joining).
     • Period n is due on joiningDate + n months, day clamped to the
       last valid day of the target month (31 Jan -> 28/29 Feb).
     • Every payment record carries an explicit feePeriod ("YYYY-MM"),
       so an advance covering 3 months is stored as 3 monthly
       allocations sharing one receipt number.
     • Nothing derived is stored: status, outstanding, due date and
       overdue days are recomputed from students + payments + today.
   ================================================================ */

/** Fee period key for the n-th billing cycle of a student. */
function periodKeyFor(student, index) { return monthKeyOf(addMonthsClamped(student.joiningDate, index)); }
/** Due date (ISO) of the n-th billing cycle. */
function dueDateFor(student, index) { return addMonthsClamped(student.joiningDate, index); }
/** Index of a fee period key within the student's cycle (0-based), or -1. */
function periodIndexOf(student, key) {
  const j = monthKeyOf(student.joiningDate);
  const [jy, jm] = j.split("-").map(Number);
  const [ky, km] = String(key).split("-").map(Number);
  if (!ky || !km) return -1;
  return (ky * 12 + km) - (jy * 12 + jm);
}
/** How many billing cycles have reached their due date on or before `asOf`. */
function periodsElapsed(student, asOf) {
  const ref = asOf || todayISO();
  let n = 0;
  // months difference gives a fast starting guess, then correct by day
  const jd = parseISO(student.joiningDate), rd = parseISO(ref);
  if (!jd || !rd || rd < jd) return 0;
  let guess = (rd.getFullYear() - jd.getFullYear()) * 12 + (rd.getMonth() - jd.getMonth());
  if (guess < 0) guess = 0;
  n = guess;
  while (dueDateFor(student, n + 1) <= ref) n++;
  while (n > 0 && dueDateFor(student, n) > ref) n--;
  return n; // index of the latest period whose due date has arrived
}

/** Total paid against a specific fee period. */
function paidForPeriod(studentId, key, payments) {
  const list = payments || getPayments();
  let sum = 0;
  for (let i = 0; i < list.length; i++) {
    const p = list[i];
    if (p.studentId === studentId && p.feePeriod === key) sum += Number(p.amount) || 0;
  }
  return sum;
}

/**
 * The heart of the app. Returns everything the UI needs about a student,
 * computed fresh from source data.
 */
function calculateStudentStatus(student, asOf, allPayments) {
  const ref = asOf || todayISO();
  const payments = (allPayments || getPayments()).filter(p => p.studentId === student.id);
  const fee = Number(student.monthlyFee) || 0;

  // Aggregate payments by period
  const byPeriod = {};
  let totalPaid = 0;
  payments.forEach(p => {
    const amt = Number(p.amount) || 0;
    totalPaid += amt;
    byPeriod[p.feePeriod] = (byPeriod[p.feePeriod] || 0) + amt;
  });

  const elapsed = periodsElapsed(student, ref);           // latest due period index
  const joined = parseISO(student.joiningDate) <= parseISO(ref);

  // Find the first period that is not fully paid, scanning from cycle 0.
  // Cap the scan generously beyond the elapsed period to detect advance payments.
  const maxPaidIndex = Object.keys(byPeriod).reduce((mx, k) => {
    const idx = periodIndexOf(student, k);
    return (byPeriod[k] > 0 && idx > mx) ? idx : mx;
  }, -1);
  const scanTo = Math.max(elapsed, maxPaidIndex) + 1;

  let firstUnpaid = 0;
  const periods = [];
  for (let i = 0; i <= scanTo; i++) {
    const key = periodKeyFor(student, i);
    const paid = byPeriod[key] || 0;
    const due = dueDateFor(student, i);
    const settled = fee <= 0 ? true : paid + 0.0001 >= fee;
    periods.push({ index: i, key: key, dueDate: due, paid: paid, fee: fee, settled: settled, balance: Math.max(0, fee - paid) });
  }
  for (let i = 0; i < periods.length; i++) {
    if (!periods[i].settled) { firstUnpaid = i; break; }
    firstUnpaid = i + 1;
  }
  const current = periods[firstUnpaid] || {
    index: firstUnpaid, key: periodKeyFor(student, firstUnpaid), dueDate: dueDateFor(student, firstUnpaid),
    paid: 0, fee: fee, settled: false, balance: fee
  };

  // Outstanding = unpaid balance of every period whose due date has passed.
  let outstanding = 0, overdueAmount = 0;
  if (joined) {
    for (let i = 0; i <= elapsed; i++) {
      const per = periods[i] || { balance: fee, dueDate: dueDateFor(student, i) };
      const bal = Math.max(0, (fee - (byPeriod[periodKeyFor(student, i)] || 0)));
      outstanding += bal;
      if (bal > 0 && per.dueDate < ref) overdueAmount += bal;
    }
  }

  const nextDueDate = current.dueDate;
  const daysOverdue = (joined && nextDueDate < ref) ? daysBetween(nextDueDate, ref) : 0;
  const daysUntilDue = daysBetween(ref, nextDueDate);

  // Status
  let status = "PAID", label = "Paid";
  if (!joined) { status = "UPCOMING"; label = "Joining " + fmtDate(student.joiningDate); }
  else if (nextDueDate < ref) {
    if (current.paid > 0) { status = "PARTIAL"; label = "Partially paid"; }
    else { status = "OVERDUE"; label = "Overdue"; }
  } else if (nextDueDate === ref) {
    if (current.paid > 0) { status = "PARTIAL"; label = "Partially paid"; }
    else { status = "DUE_TODAY"; label = "Due today"; }
  } else {
    if (firstUnpaid > elapsed + 1) { status = "ADVANCE"; label = "Advance paid"; }
    else if (daysUntilDue <= (getSettings().upcomingWindow || 7)) { status = "UPCOMING"; label = "Due in " + daysUntilDue + " day" + (daysUntilDue === 1 ? "" : "s"); }
    else { status = "PAID"; label = "Paid"; }
  }
  // Overdue with a partial payment still needs the overdue emphasis
  if (status === "PARTIAL" && nextDueDate < ref) label = "Partially paid · " + daysOverdue + "d overdue";

  const sorted = payments.slice().sort((a, b) => (a.paymentDate || "").localeCompare(b.paymentDate || ""));
  const last = sorted[sorted.length - 1] || null;

  const monthsPaidAhead = Math.max(0, firstUnpaid - (elapsed + 1));

  return {
    student: student,
    fee: fee,
    periods: periods,
    currentPeriod: current.key,
    currentPeriodIndex: current.index,
    currentPeriodPaid: current.paid,
    currentPeriodBalance: current.balance,
    nextDueDate: nextDueDate,
    daysOverdue: daysOverdue,
    daysUntilDue: daysUntilDue,
    outstanding: Math.round(outstanding * 100) / 100,
    overdueAmount: Math.round(overdueAmount * 100) / 100,
    totalPaid: Math.round(totalPaid * 100) / 100,
    paymentCount: payments.length,
    lastPayment: last,
    status: status,
    statusLabel: label,
    monthsPaidAhead: monthsPaidAhead,
    elapsedIndex: elapsed,
    joined: joined
  };
}

function calculateOutstanding(student) { return calculateStudentStatus(student).outstanding; }
function calculateNextDueDate(student) { return calculateStudentStatus(student).nextDueDate; }

/** Status metadata used for badges everywhere. */
const STATUS_META = {
  PAID:      { text: "Paid",           cls: "b-paid" },
  DUE_TODAY: { text: "Due today",      cls: "b-due" },
  OVERDUE:   { text: "Overdue",        cls: "b-over" },
  PARTIAL:   { text: "Partially paid", cls: "b-part" },
  ADVANCE:   { text: "Advance paid",   cls: "b-adv" },
  UPCOMING:  { text: "Upcoming",       cls: "b-up" }
};
function badge(status, textOverride) {
  const m = STATUS_META[status] || { text: status, cls: "b-plain" };
  return '<span class="badge ' + m.cls + '">' + esc(textOverride || m.text) + "</span>";
}

/** Compute the status of every student once — used by dashboard, lists and reports. */
function computeAll(asOf) {
  const payments = getPayments();
  const ref = asOf || todayISO();
  return getStudents().map(s => calculateStudentStatus(s, ref, payments));
}

/**
 * Allocate a payment amount across billing periods, starting at
 * `startIndex`, filling each period's balance before moving on.
 * Returns an array of {feePeriod, amount} allocations.
 */
function allocateAmount(student, startIndex, amount, existingPayments) {
  const payments = existingPayments || getPayments();
  const fee = Number(student.monthlyFee) || 0;
  let remaining = Math.round((Number(amount) || 0) * 100) / 100;
  const out = [];
  let i = Math.max(0, startIndex);
  let guard = 0;
  while (remaining > 0.004 && guard < 240) {
    guard++;
    const key = periodKeyFor(student, i);
    const already = paidForPeriod(student.id, key, payments) + out.filter(o => o.feePeriod === key).reduce((s, o) => s + o.amount, 0);
    const need = fee > 0 ? Math.max(0, fee - already) : remaining;
    if (need <= 0.004) { i++; continue; }
    const take = Math.min(need, remaining);
    out.push({ feePeriod: key, amount: Math.round(take * 100) / 100 });
    remaining = Math.round((remaining - take) * 100) / 100;
    i++;
  }
  if (remaining > 0.004 && out.length) out[out.length - 1].amount += remaining;
  if (!out.length) out.push({ feePeriod: periodKeyFor(student, Math.max(0, startIndex)), amount: Number(amount) || 0 });
  return out;
}

/** Suggested amount to clear `months` billing cycles from the first unpaid one. */
function amountForMonths(student, startIndex, months) {
  const fee = Number(student.monthlyFee) || 0;
  const payments = getPayments();
  let total = 0;
  for (let k = 0; k < months; k++) {
    const key = periodKeyFor(student, startIndex + k);
    total += Math.max(0, fee - paidForPeriod(student.id, key, payments));
  }
  return Math.round(total * 100) / 100;
}

/* ================================================================

   ================================================================ */
function renderTemplate(tpl, vars) {
  return String(tpl || "").replace(/\{\{(\w+)\}\}/g, function (_, k) {
    const v = vars[k];
    return (v === undefined || v === null) ? "" : String(v);
  }).replace(/\n{3,}/g, "\n\n");
}

function templateVars(student, extra) {
  const st = getSettings();
  const base = {
    brandName: st.brandName,
    teacherName: st.teacherName,
    studentName: student ? student.name : "",
    parentName: (student && student.parentName) ? student.parentName : "Parent/Guardian",
    school: (student && student.school) || "",
    className: (student && student.className) || "",
    monthlyFee: student ? money(student.monthlyFee) : "",
    joiningDate: student ? fmtDate(student.joiningDate) : ""
  };
  return Object.assign(base, extra || {});
}

function waLink(number, message) {
  const n = normalizeWhatsApp(number);
  return "https://wa.me/" + n + "?text=" + encodeURIComponent(message);
}

/** Preview → edit → open WhatsApp. Never opens a malformed link. */
function whatsappPreview(opts) {
  const number = normalizeWhatsApp(opts.number);
  if (!isValidWhatsApp(number)) {
    toast("That WhatsApp number doesn't look right. Edit the student to fix it.", "bad");
    return;
  }
  openSheet({
    title: opts.title || "WhatsApp message",
    subtitle: (opts.to ? "To " + opts.to + " · " : "") + prettyPhone(number),
    body:
      '<div class="field"><label>Message — edit before sending if you like</label>' +
      '<textarea class="input" id="waMsg" style="min-height:230px;font-size:14px">' + esc(opts.message) + "</textarea></div>" +
      '<p class="hint">This opens WhatsApp with the message ready. Nothing is sent automatically, and nothing leaves this device until you press send in WhatsApp.</p>',
    footer:
      '<button class="btn btn-ghost" data-close>Cancel</button>' +
      '<button class="btn btn-wa" id="waGo">' + I.wa + " Open WhatsApp</button>",
    onMount: function (sheet) {
      $("#waGo", sheet).addEventListener("click", function () {
        const msg = $("#waMsg", sheet).value;
        window.open(waLink(number, msg), "_blank", "noopener");
        closeSheet();
        if (opts.onSent) opts.onSent();
      });
    }
  });
}

const UI = {
  screen: "dashboard",
  studentId: null,
  search: "",
  filter: "all",
  sort: "name",
  payFilter: { month: "", method: "all", studentId: "", from: "", to: "" },

function toast(msg, kind) {
  const root = $("#toastRoot");
  const el = document.createElement("div");
  el.className = "toast " + (kind || "ok");
  el.innerHTML = (kind === "bad" ? I.alert : I.checkCircle) + "<span>" + esc(msg) + "</span>";
  root.appendChild(el);
  setTimeout(() => { el.style.transition = "opacity .25s"; el.style.opacity = "0"; setTimeout(() => el.remove(), 260); }, kind === "bad" ? 3800 : 2600);
}

function openSheet(opts) {
  const scrim = document.createElement("div");
  scrim.className = "scrim";
  scrim.innerHTML =
    '<div class="sheet ' + (opts.full ? "full" : "") + '" role="dialog" aria-modal="true">' +
      (opts.full ? "" : '<div class="grab"></div>') +
      '<div class="sheet-head">' +
        (opts.back ? '<button class="icon-btn" style="background:var(--line-2);color:var(--text)" data-close aria-label="Back">' + I.back + "</button>" : "") +
        '<div style="flex:1;min-width:0"><h2>' + esc(opts.title || "") + "</h2>" +
          (opts.subtitle ? '<div class="sub">' + esc(opts.subtitle) + "</div>" : "") + "</div>" +
        (opts.back ? "" : '<button class="icon-btn" style="background:var(--line-2);color:var(--text)" data-close aria-label="Close">' + I.x + "</button>") +
      "</div>" +
      '<div class="sheet-body">' + (opts.body || "") + "</div>" +
      (opts.footer ? '<div class="sheet-foot">' + opts.footer + "</div>" : "") +
    "</div>";
  $("#modalRoot").appendChild(scrim);
  UI.sheetStack.push(scrim);
  document.body.style.overflow = "hidden";
  scrim.addEventListener("click", e => { if (e.target === scrim) closeSheet(); });
  $$("[data-close]", scrim).forEach(b => b.addEventListener("click", closeSheet));
  if (opts.onMount) opts.onMount(scrim);
  const firstInput = scrim.querySelector(".sheet-body input, .sheet-body select, .sheet-body textarea");
  if (firstInput && !opts.noAutofocus && window.innerWidth > 700) firstInput.focus();
  return scrim;
}
function closeSheet() {
  const s = UI.sheetStack.pop();
  if (s) s.remove();
  if (!UI.sheetStack.length) document.body.style.overflow = "";
}
function closeAllSheets() { while (UI.sheetStack.length) closeSheet(); }

function confirmDialog(opts) {
  openSheet({
    title: opts.title || "Are you sure?",
    body:
      '<div style="padding:4px 2px 6px">' +
      (opts.tone === "danger" ? '<div class="alert bad" style="margin-bottom:14px"><div>' + I.alert + '</div><div><div class="t">' + esc(opts.warnTitle || "This cannot be undone") + '</div><div class="b">' + esc(opts.warning || "") + "</div></div></div>" : "") +
      '<p style="font-size:14.5px;line-height:1.55;margin:0 0 12px">' + (opts.messageHtml || esc(opts.message || "")) + "</p>" +
      (opts.detailsHtml || "") +
      "</div>",
    footer:
      '<button class="btn btn-ghost" data-close>' + esc(opts.cancelText || "Cancel") + "</button>" +
      '<button class="btn ' + (opts.tone === "danger" ? "btn-danger" : "btn-primary") + '" id="cfmOk">' + esc(opts.confirmText || "Confirm") + "</button>",
    onMount: function (sheet) {
      $("#cfmOk", sheet).addEventListener("click", function () { closeSheet(); opts.onConfirm && opts.onConfirm(); });
    }
  });
}

/* ---------- navigation ---------- */
const NAV = [
  { id: "dashboard", label: "Home", icon: I.home },
  { id: "students", label: "Students", icon: I.users },
  { id: "due", label: "Due", icon: I.bell },
  { id: "payments", label: "Payments", icon: I.receipt },
  { id: "more", label: "More", icon: I.more }
];

function go(screen, opts) {
  UI.screen = screen;
  UI.listLimit = 60;
  if (opts && opts.studentId) UI.studentId = opts.studentId;
  window.scrollTo({ top: 0, behavior: "instant" in document.documentElement.style ? "instant" : "auto" });
  render();
}

function renderNav() {
  const all = computeAll();
  const dueCount = all.filter(r => r.status === "OVERDUE" || r.status === "DUE_TODAY" || (r.status === "PARTIAL" && r.nextDueDate <= todayISO())).length;
  $("#nav").innerHTML = '<div class="navbrand">' + esc(getSettings().brandName.toUpperCase()) + "<span>" + esc(getSettings().teacherName) + "</span></div>" + NAV.map(n =>
    '<button class="navitem ' + (UI.screen === n.id || (n.id === "more" && ["settings", "reports", "backup", "notifications"].includes(UI.screen)) ? "on" : "") + '" data-nav="' + n.id + '">' +
      n.icon + "<span>" + n.label + "</span>" +
      (n.id === "due" && dueCount ? '<span class="dot">' + dueCount + "</span>" : "") +
    "</button>"
  ).join("");
  $$("[data-nav]", $("#nav")).forEach(b => b.addEventListener("click", () => go(b.dataset.nav)));
}

function renderTopbar(cfg) {
  const st = getSettings();
  const dark = document.documentElement.dataset.theme === "dark";
  $("#topbar").innerHTML =
    '<div class="topbar-row">' +
      '<div class="seal">॥</div>' +
      '<div class="brandwrap">' +
        '<div class="brand">' + esc(st.brandName.toUpperCase()) + "</div>" +
        '<div class="brand-sub">Tuition fee management · ' + esc(st.teacherName) + "</div>" +
      "</div>" +
      '<button class="icon-btn" id="themeBtn" aria-label="Switch theme">' + (dark ? I.sun : I.moon) + "</button>" +
    "</div>" +
    (cfg.backTo ? '<button class="back-btn" id="backBtn">' + I.back + " " + esc(cfg.backLabel || "Back") + "</button>" : "") +
    (cfg.title ? '<h1 class="screen-title">' + esc(cfg.title) + "</h1>" : "") +
    (cfg.note ? '<div class="screen-note">' + esc(cfg.note) + "</div>" : "");
  $("#themeBtn").addEventListener("click", toggleTheme);
  if (cfg.backTo) $("#backBtn").addEventListener("click", () => go(cfg.backTo));
}

function toggleTheme() {
  const st = getSettings();
  st.theme = st.theme === "dark" ? "light" : "dark";
  saveSettings(st);
  applyTheme();
  render();
}
function applyTheme() {
  const st = getSettings();
  document.documentElement.dataset.theme = st.theme === "dark" ? "dark" : "light";
  const meta = document.querySelector('meta[name="theme-color"]');
  if (meta) meta.setAttribute("content", st.theme === "dark" ? "#0C1A36" : "#0F2A5C");
}

/* ---------------- Dashboard ---------------- */
function screenDashboard() {
  const st = getSettings();
  const all = computeAll();
  const payments = getPayments();
  const t = todayISO();
  const mk = currentMonthKey();

  const overdue = all.filter(r => r.status === "OVERDUE" || (r.status === "PARTIAL" && r.nextDueDate < t));
  const dueToday = all.filter(r => r.nextDueDate === t && r.currentPeriodBalance > 0);
  const upcoming = all.filter(r => r.nextDueDate > t && daysBetween(t, r.nextDueDate) <= (st.upcomingWindow || 7));

  const collectedMonth = payments.filter(p => monthKeyOf(p.paymentDate) === mk).reduce((s, p) => s + (Number(p.amount) || 0), 0);
  const collectedToday = payments.filter(p => p.paymentDate === t).reduce((s, p) => s + (Number(p.amount) || 0), 0);
  const totalOutstanding = all.reduce((s, r) => s + r.outstanding, 0);
  const totalOverdue = all.reduce((s, r) => s + r.overdueAmount, 0);
  const joinedThisMonth = getStudents().filter(s => monthKeyOf(s.joiningDate) === mk);
  const joinedToday = getStudents().filter(s => s.joiningDate === t);
  const expected = collectedMonth + totalOutstanding;
  const rate = expected > 0 ? Math.round((collectedMonth / expected) * 100) : (all.length ? 100 : 0);

  renderTopbar({ title: "Good " + partOfDay() + ", " + firstName(st.teacherName), note: fmtDateLong(t) });

  let alerts = "";
  if (overdue.length) {
    alerts += '<div class="alert bad"><div>' + I.alert + '</div><div style="flex:1"><div class="t">' + overdue.length + " student" + (overdue.length > 1 ? "s have" : " has") + " overdue fees</div>" +
      '<div class="b">' + money(totalOverdue) + " outstanding past the due date</div></div>" +
      '<button data-act="go-due">Collect</button></div>';
  }
  if (dueToday.length) {
    alerts += '<div class="alert warn"><div>' + I.clock + '</div><div style="flex:1"><div class="t">' + dueToday.length + " fee" + (dueToday.length > 1 ? "s" : "") + " due today</div>" +
      '<div class="b">Send a reminder or record the payment</div></div>' +
      '<button data-act="go-due">Open</button></div>';
  }
  if (!overdue.length && !dueToday.length && all.length) {
    alerts += '<div class="alert ok"><div>' + I.checkCircle + '</div><div style="flex:1"><div class="t">All fees are up to date 🎉</div>' +
      '<div class="b">' + (upcoming.length ? upcoming.length + " fee" + (upcoming.length > 1 ? "s" : "") + " coming up in the next " + (st.upcomingWindow || 7) + " days" : "Nothing due in the next " + (st.upcomingWindow || 7) + " days") + "</div></div></div>";
  }

  const html =
    alerts +
    '<div class="stats">' +
      '<div class="stat hero"><div class="k">Collected in ' + esc(monthLabel(mk)) + '</div><div class="v num">' + money(collectedMonth) + "</div>" +
        '<div class="m">' + plural(payments.filter(p => monthKeyOf(p.paymentDate) === mk).length, "payment") + " · " + rate + "% of expected</div></div>" +
      statCard("Students", '<span>' + all.length + "</span>", joinedThisMonth.length + " joined this month") +
      statCard("Today's collection", money(collectedToday), collectedToday > 0 ? "Received today" : "Nothing yet today") +
      statCard("Fees due", money(totalOutstanding), plural(overdue.length + dueToday.length, "student"), totalOutstanding > 0 ? "warn" : "ok") +
      statCard("Overdue", money(totalOverdue), plural(overdue.length, "student"), totalOverdue > 0 ? "bad" : "ok") +
    "</div>" +

    '<div class="section-head"><h2>Quick actions</h2></div>' +
    '<div class="qa">' +
      qaBtn("add-student", I.plus, "Add student", true) +
      qaBtn("collect-picker", I.rupee, "Collect fee") +
      qaBtn("go-due", I.bell, "Due fees") +
      qaBtn("go-students", I.users, "Students") +
      qaBtn("go-payments", I.receipt, "Payments") +
      qaBtn("go-reports", I.chart, "Reports") +
      qaBtn("go-backup", I.save, "Backup") +
    "</div>" +

    '<div class="section-head"><h2>Today</h2><span class="link">' + fmtDate(t) + "</span></div>" +
    '<div class="card pad">' +
      kv("Collected today", money(collectedToday)) +
      kv("Students joined today", String(joinedToday.length)) +
      kv("Fees due today", String(dueToday.length)) +
      kv("Overdue students", String(overdue.length)) +
      kv("Upcoming in " + (st.upcomingWindow || 7) + " days", String(upcoming.length)) +
    "</div>" +

    (overdue.length || dueToday.length
      ? '<div class="section-head"><h2>Needs attention</h2><button class="link" data-act="go-due">See all</button></div>' +
        '<div class="slist">' + overdue.concat(dueToday).slice(0, 3).map(dueCard).join("") + "</div>"
      : "") +

    (payments.length

function partOfDay() { const h = new Date().getHours(); return h < 12 ? "morning" : h < 17 ? "afternoon" : "evening"; }

/* ---------------- Due & overdue ---------------- */
function screenDue() {
  const t = todayISO();
  const st = getSettings();
  const all = computeAll();
  const overdue = all.filter(r => r.nextDueDate < t && r.currentPeriodBalance > 0).sort((a, b) => a.nextDueDate.localeCompare(b.nextDueDate));
  const today_ = all.filter(r => r.nextDueDate === t && r.currentPeriodBalance > 0);
  const soon = all.filter(r => r.nextDueDate > t && daysBetween(t, r.nextDueDate) <= (st.upcomingWindow || 7)).sort((a, b) => a.nextDueDate.localeCompare(b.nextDueDate));
  const totalDue = overdue.concat(today_).reduce((s, r) => s + r.currentPeriodBalance, 0);

  renderTopbar({ title: "Due & overdue", note: (overdue.length + today_.length) + " to collect · " + money(totalDue) });

  let html = "";
  if (!all.length) {
    html = emptyState(I.users, "No students yet", "Add a student and their fee schedule builds itself.", "Add student", "add-student");
  } else if (!overdue.length && !today_.length && !soon.length) {
    html = emptyState(I.checkCircle, "No pending fees right now", "Every student is paid up for the current cycle. The next due dates are further out than " + (st.upcomingWindow || 7) + " days.");
  } else {
    if (overdue.length) html += group("Overdue", overdue.length, overdue.map(dueCard).join(""));
    if (today_.length) html += group("Due today", today_.length, today_.map(dueCard).join(""));
    if (soon.length) html += group("Upcoming", soon.length, soon.map(dueCard).join(""));
  }
  paint(html);
}
function group(title, count, inner) {
  return '<div class="section-head" style="margin-top:14px"><h2>' + esc(title) + '</h2><span class="link">' + count + "</span></div>" +
    '<div class="slist">' + inner + "</div>";
}

function dueCard(r) {
  const s = r.student;

/* ---------------- Students ---------------- */
const FILTERS = [
  { id: "all", label: "All" }, { id: "overdue", label: "Overdue" }, { id: "duetoday", label: "Due today" },
  { id: "upcoming", label: "Upcoming" }, { id: "partial", label: "Partial" }, { id: "paid", label: "Paid" },
  { id: "advance", label: "Advance" }, { id: "new", label: "New this month" }
];
const SORTS = [
  { id: "name", label: "Name A–Z" }, { id: "name_desc", label: "Name Z–A" },
  { id: "joining", label: "Newest joined" }, { id: "due", label: "Due date" },
  { id: "fee_desc", label: "Highest fee" }, { id: "fee_asc", label: "Lowest fee" }
];

function matchesFilter(r, f) {
  const t = todayISO();
  switch (f) {
    case "overdue": return r.nextDueDate < t && r.currentPeriodBalance > 0;
    case "duetoday": return r.nextDueDate === t && r.currentPeriodBalance > 0;
    case "upcoming": return r.nextDueDate > t && daysBetween(t, r.nextDueDate) <= (getSettings().upcomingWindow || 7);
    case "partial": return r.status === "PARTIAL";
    case "paid": return r.status === "PAID" || r.status === "ADVANCE";
    case "advance": return r.status === "ADVANCE";
    case "new": return monthKeyOf(r.student.joiningDate) === currentMonthKey();
    default: return true;
  }
}
function searchStudents(list, q) {
  const s = String(q || "").trim().toLowerCase();
  if (!s) return list;
  return list.filter(r => {
    const st = r.student;
    return [st.name, st.parentName, st.school, st.className, st.whatsapp, normalizeWhatsApp(st.whatsapp), st.notes, st.address]
      .filter(Boolean).some(v => String(v).toLowerCase().includes(s));
  });
}
function sortRows(rows, sort) {
  const c = rows.slice();
  const byName = (a, b) => a.student.name.localeCompare(b.student.name, undefined, { sensitivity: "base" });
  switch (sort) {
    case "name_desc": return c.sort((a, b) => byName(b, a));
    case "joining": return c.sort((a, b) => b.student.joiningDate.localeCompare(a.student.joiningDate) || byName(a, b));
    case "due": return c.sort((a, b) => a.nextDueDate.localeCompare(b.nextDueDate) || byName(a, b));
    case "fee_desc": return c.sort((a, b) => (b.fee - a.fee) || byName(a, b));
    case "fee_asc": return c.sort((a, b) => (a.fee - b.fee) || byName(a, b));
    default: return c.sort(byName);
  }
}

function screenStudents() {
  const all = computeAll();
  renderTopbar({ title: "Students", note: plural(all.length, "student") + " · " + money(all.reduce((s, r) => s + r.fee, 0)) + " a month" });

  const counts = {};
  FILTERS.forEach(f => counts[f.id] = all.filter(r => matchesFilter(r, f.id)).length);
  let rows = sortRows(searchStudents(all.filter(r => matchesFilter(r, UI.filter)), UI.search), UI.sort);
  const shown = rows.slice(0, UI.listLimit);

  const html =
    '<div class="search">' + I.search +

    "</div>" +

      '<button class="chip ' + (UI.filter === f.id ? "on" : "") + '" data-act="filter" data-id="' + f.id + '">' + esc(f.label) + '<span class="n">' + counts[f.id] + "</span></button>").join("") + "</div>" +
    '<div class="between" style="margin:2px 2px 12px">' +

      '<button class="btn btn-sm btn-ghost" data-act="sort-menu">' + I.sort + " " + esc((SORTS.find(s => s.id === UI.sort) || SORTS[0]).label) + "</button>" +
    "</div>" +
    (rows.length
      ? '<div class="slist">' + shown.map(studentCard).join("") + "</div>" +
        (rows.length > shown.length ? '<button class="btn btn-block btn-ghost" style="margin-top:12px" data-act="more-list">Show ' + Math.min(60, rows.length - shown.length) + " more</button>" : "")
      : (all.length
          ? emptyState(I.search, "No matches", "Nothing matches “" + (UI.search || (FILTERS.find(f => f.id === UI.filter) || {}).label) + "”. Try another search or filter.")
          : emptyState(I.users, "No students yet", "Add your first student to start managing tuition fees.", "Add student", "add-student"))) +
    '<div style="height:8px"></div>' +
    '<button class="btn btn-primary btn-block" data-act="add-student" style="margin-top:14px">' + I.plus + " Add student</button>";

  paint(html);

  if (q) {

/* ---------------- Payment history ---------------- */
/** The payment list currently on screen, honouring every filter. */
function filteredPayments() {
  const f = UI.payFilter;
  const students = getStudents();
  const nameOf = id => (students.find(s => s.id === id) || {}).name || "Deleted student";
  let list = getPayments().slice();
  if (f.month) list = list.filter(p => monthKeyOf(p.paymentDate) === f.month);
  if (f.method !== "all") list = list.filter(p => p.paymentMethod === f.method);
  if (f.studentId) list = list.filter(p => p.studentId === f.studentId);
  if (f.from) list = list.filter(p => p.paymentDate >= f.from);
  if (f.to) list = list.filter(p => p.paymentDate <= f.to);
  if (UI.search) {
    const q = UI.search.toLowerCase();
    list = list.filter(p => (nameOf(p.studentId) + " " + (p.receiptNumber || "") + " " + (p.notes || "")).toLowerCase().includes(q));
  }
  return list.sort(byPaymentDateDesc);
}

  const total = list.reduce((s, p) => s + (Number(p.amount) || 0), 0);

        months.map(m => '<option value="' + m + '"' + (f.month === m ? " selected" : "") + ">" + esc(monthLabel(m)) + "</option>").join("") + "</select></div>" +

function readStudentForm(sheet) {
  return {
    name: $("#fName", sheet).value.trim(),
    whatsapp: $("#fWa", sheet).value.trim(),
    joiningDate: $("#fJoin", sheet).value,
    monthlyFee: Number($("#fFee", sheet).value),

    school: $("#fSchool", sheet).value.trim(),

function setErr(sheet, id, msg) {
  const e = $("#e" + id, sheet), f = $("#f" + id, sheet);
  if (!e) return;
  e.textContent = msg || ""; e.classList.toggle("show", !!msg);
  if (f) f.classList.toggle("err", !!msg);
}
function validateStudent(sheet, data) {
  let ok = true;
  ["Name", "Wa", "Join", "Fee"].forEach(k => setErr(sheet, k, ""));
  if (data.name.length < 2) { setErr(sheet, "Name", "Enter the student's name."); ok = false; }
  if (!isValidWhatsApp(data.whatsapp)) { setErr(sheet, "Wa", "Enter a valid mobile number (10 digits for India)."); ok = false; }
  if (!isValidISO(data.joiningDate)) { setErr(sheet, "Join", "Pick a valid joining date."); ok = false; }
  else if (parseISO(data.joiningDate) > parseISO(addMonthsClamped(todayISO(), 12))) { setErr(sheet, "Join", "That date is too far in the future."); ok = false; }
  if (!(data.monthlyFee > 0)) { setErr(sheet, "Fee", "Monthly fee must be more than 0."); ok = false; }
  return ok;
}

function submitStudent(sheet, existing, collectedFn) {
  const data = readStudentForm(sheet);
  if (!validateStudent(sheet, data)) { toast("Please fix the highlighted fields.", "bad"); return; }
  const norm = normalizeWhatsApp(data.whatsapp);
  const dup = getStudents().find(s => normalizeWhatsApp(s.whatsapp) === norm && (!existing || s.id !== existing.id));

  const proceed = () => existing ? applyStudentEdit(existing, data) : createStudent(data, collectedFn ? collectedFn() : false, sheet);

  if (dup) {
    confirmDialog({
      title: "This number is already registered",
      message: "A student with this WhatsApp number already exists: " + dup.name + " (joined " + fmtDate(dup.joiningDate) + ").",
      confirmText: "Continue anyway",
      onConfirm: proceed
    });
    return;
  }
  if (existing && (existing.joiningDate !== data.joiningDate || Number(existing.monthlyFee) !== data.monthlyFee)) {
    confirmDialog({
      title: "Confirm fee changes",
      tone: "danger",
      warnTitle: "This changes future fee calculations",
      warning: "Due dates and outstanding amounts will be recalculated. Past payment records are never altered.",
      messageHtml:
        (existing.joiningDate !== data.joiningDate ? "Joining date: <b>" + fmtDate(existing.joiningDate) + "</b> → <b>" + fmtDate(data.joiningDate) + "</b><br>" : "") +
        (Number(existing.monthlyFee) !== data.monthlyFee ? "Monthly fee: <b>" + money(existing.monthlyFee) + "</b> → <b>" + money(data.monthlyFee) + "</b>" : ""),
      confirmText: "Save changes",
      onConfirm: proceed
    });
    return;
  }
  proceed();
}

function createStudent(data, collected, sheet) {
  const now = new Date().toISOString();
  const student = Object.assign({}, data, {
    id: uid("student"),
    whatsapp: normalizeWhatsApp(data.whatsapp),
    createdAt: now, updatedAt: now
  });
  const students = getStudents();
  students.push(student);
  saveStudents(students);

  if (collected) {
    const method = sheet && $("#fMethod", sheet) ? $("#fMethod", sheet).value : getSettings().defaultPaymentMethod;
    recordPayment({
      studentId: student.id,
      amount: student.monthlyFee,
      paymentDate: student.joiningDate,
      startIndex: 0,
      paymentMethod: method,
      notes: "Fee collected at joining"
    });
  }
  closeSheet();
  toast("Student added.");
  render();
  showJoiningConfirmation(student.id);
}

function applyStudentEdit(existing, data) {
  const students = getStudents();
  const idx = students.findIndex(s => s.id === existing.id);
  if (idx < 0) return;
  students[idx] = Object.assign({}, students[idx], data, {
    whatsapp: normalizeWhatsApp(data.whatsapp),
    updatedAt: new Date().toISOString()
  });
  saveStudents(students);
  closeAllSheets();
  toast("Changes saved.");
  render();
  openProfile(existing.id);
}

function deleteStudent(id) {
  const s = getStudent(id);
  if (!s) return;
  const count = getStudentPaymentHistory(id).length;
  confirmDialog({
    title: "Delete " + s.name + "?",
    tone: "danger",
    warnTitle: "This permanently deletes the profile and " + count + " payment record" + (count === 1 ? "" : "s"),
    warning: "The data is stored only on this device and cannot be recovered without a backup.",
    message: "Everything about " + s.name + " will be removed from this device.",
    confirmText: "Delete permanently",
    onConfirm: function () {
      saveStudents(getStudents().filter(x => x.id !== id));
      savePayments(getPayments().filter(p => p.studentId !== id));
      closeAllSheets();
      toast(s.name + " deleted.");
      go("students");
    }
  });
}

/**
 * Records a payment, splitting it into one record per fee period so
 * reporting and due calculation stay simple and reliable.
 */
function recordPayment(opts) {
  const s = getStudent(opts.studentId);
  const receiptNumber = opts.receiptNumber || nextReceiptNumber();
  const now = new Date().toISOString();
  const allocs = allocateAmount(s, opts.startIndex, opts.amount);
  const payments = getPayments();
  allocs.forEach(a => {
    payments.push({
      id: uid("payment"),
      studentId: s.id,
      amount: a.amount,
      paymentDate: opts.paymentDate,
      feePeriod: a.feePeriod,
      paymentMethod: opts.paymentMethod || getSettings().defaultPaymentMethod,
      receiptNumber: receiptNumber,
      notes: opts.notes || "",
      createdAt: now,
      updatedAt: now
    });
  });
  savePayments(payments);
  return { receiptNumber: receiptNumber, allocations: allocs };
}

/* ---------------- Receipt ---------------- */
function receiptData(receiptNumber) {
  const items = getPayments().filter(p => p.receiptNumber === receiptNumber).sort((a, b) => a.feePeriod.localeCompare(b.feePeriod));
  if (!items.length) return null;
  const s = getStudent(items[0].studentId);
  if (!s) return null;
  const total = items.reduce((sum, p) => sum + (Number(p.amount) || 0), 0);
  const all = getPayments();
  const withoutThis = all.filter(p => p.receiptNumber !== receiptNumber);
  // Historical accuracy: both figures are computed as at the payment date,
  // so a receipt reopened months later still reads the way it did that day.
  const before = calculateStudentStatus(s, items[0].paymentDate, withoutThis);
  const r = calculateStudentStatus(s, items[0].paymentDate, all);
  return {
    items: items, student: s, total: total, status: r, before: before,
    periodLabel: items.length === 1 ? monthLabel(items[0].feePeriod)
      : monthLabel(items[0].feePeriod) + " – " + monthLabel(items[items.length - 1].feePeriod),
    date: items[0].paymentDate, method: items[0].paymentMethod, number: receiptNumber
  };
}

function showReceipt(receiptNumber) {
  const d = receiptData(receiptNumber);
  if (!d) { toast("Receipt not found.", "bad"); return; }
  openSheet({
    title: "Receipt", subtitle: d.number,
    body: receiptHTML(d),
    noAutofocus: true,
    footer:
      '<button class="btn btn-sm" id="rCopy" aria-label="Copy receipt">' + I.copy + "</button>" +
      '<button class="btn btn-sm" id="rPrint" aria-label="Print receipt">' + I.print + "</button>" +
      '<button class="btn btn-wa" id="rSend">' + I.wa + " Send receipt</button>",
    onMount: function (sheet) {
      $("#rCopy", sheet).addEventListener("click", function () { copyText(receiptPlainText(d)); });
      $("#rPrint", sheet).addEventListener("click", function () { printNode(receiptHTML(d)); });
      $("#rSend", sheet).addEventListener("click", function () {
        const msg = receiptMessage(d);
        if (navigator.share) {
          navigator.share({ title: "Fee receipt " + d.number, text: msg })
            .catch(() => whatsappPreview({ number: d.student.whatsapp, to: d.student.name, title: "Send receipt", message: msg }));
        } else {
          whatsappPreview({ number: d.student.whatsapp, to: d.student.name, title: "Send receipt", message: msg });
        }
      });
    }
  });
}
function copyText(text) {
  if (navigator.clipboard && navigator.clipboard.writeText) {
    navigator.clipboard.writeText(text).then(() => toast("Copied."), () => fallbackCopy(text));
  } else fallbackCopy(text);
}
function fallbackCopy(text) {
  const ta = document.createElement("textarea");
  ta.value = text; ta.style.position = "fixed"; ta.style.opacity = "0";
  document.body.appendChild(ta); ta.select();
  try { document.execCommand("copy"); toast("Copied."); } catch (e) { toast("Copy failed — select the text manually.", "bad"); }
  ta.remove();
}
function printNode(html) {
  $("#printArea").innerHTML = html;
  setTimeout(() => { window.print(); setTimeout(() => { $("#printArea").innerHTML = ""; }, 600); }, 60);
}

   ================================================================ */
function screenReports() {
  const mk = UI.reportMonth;
  const payments = getPayments();
  const students = getStudents();
  const all = computeAll();
  const inMonth = payments.filter(p => monthKeyOf(p.paymentDate) === mk);
  const collected = inMonth.reduce((s, p) => s + (Number(p.amount) || 0), 0);
  const joined = students.filter(s => monthKeyOf(s.joiningDate) === mk);
  const outstanding = all.reduce((s, r) => s + r.outstanding, 0);
  const overdue = all.reduce((s, r) => s + r.overdueAmount, 0);
  const expected = collected + outstanding;
  const rate = expected > 0 ? Math.round((collected / expected) * 100) : 0;
  const avg = inMonth.length ? collected / inMonth.length : 0;

  const byMethod = {};
  PAYMENT_METHODS.forEach(m => byMethod[m] = 0);
  inMonth.forEach(p => { byMethod[p.paymentMethod] = (byMethod[p.paymentMethod] || 0) + (Number(p.amount) || 0); });

  // last 6 months trend
  const trend = [];
  for (let i = 5; i >= 0; i--) {
    const k = monthKeyAdd(mk, -i);
    trend.push({ key: k, value: payments.filter(p => monthKeyOf(p.paymentDate) === k).reduce((s, p) => s + (Number(p.amount) || 0), 0) });
  }
  const months = monthOptions();

  renderTopbar({ backTo: "more", backLabel: "More", title: "Reports", note: monthLabel(mk) });

  const maxT = Math.max.apply(null, trend.map(t => t.value).concat([1]));
  const chart =
    '<svg class="chart" viewBox="0 0 320 130" role="img" aria-label="Collection over the last six months">' +
      trend.map((t, i) => {
        const h = Math.max(2, Math.round((t.value / maxT) * 92));
        const x = 10 + i * 51, y = 104 - h;
        const on = t.key === mk;
        return '<rect x="' + x + '" y="' + y + '" width="30" height="' + h + '" rx="5" fill="' + (on ? "var(--gold)" : "var(--navy-2)") + '" opacity="' + (on ? 1 : .78) + '"/>' +
          '<text x="' + (x + 15) + '" y="118" text-anchor="middle" font-size="9" fill="var(--muted)">' + esc(monthLabelShort(t.key)) + "</text>" +
          (t.value ? '<text x="' + (x + 15) + '" y="' + (y - 4) + '" text-anchor="middle" font-size="8.5" fill="var(--faint)">' + moneyPlain(Math.round(t.value / 100) / 10) + "k</text>" : "");
      }).join("") +
    "</svg>";

  const maxM = Math.max.apply(null, PAYMENT_METHODS.map(m => byMethod[m] || 0).concat([1]));

  const html =
    '<div class="field"><label>Month</label><select class="input" id="rMonth">' + months.map(m =>
      '<option value="' + m + '"' + (m === mk ? " selected" : "") + ">" + esc(monthLabel(m)) + "</option>").join("") + "</select></div>" +
    '<div class="stats">' +
      '<div class="stat hero"><div class="k">Collected in ' + esc(monthLabel(mk)) + '</div><div class="v num">' + money(collected) + "</div>" +
        '<div class="m">' + plural(inMonth.length, "payment") + " · average " + money(Math.round(avg)) + "</div></div>" +
      statCard("New admissions", String(joined.length), joined.reduce((s, x) => s + Number(x.monthlyFee || 0), 0) ? money(joined.reduce((s, x) => s + Number(x.monthlyFee || 0), 0)) + " added monthly" : "") +
      statCard("Total students", String(students.length), money(all.reduce((s, r) => s + r.fee, 0)) + " monthly value") +
      statCard("Outstanding", money(outstanding), "Across all cycles", outstanding > 0 ? "warn" : "ok") +
      statCard("Overdue", money(overdue), "Past due date", overdue > 0 ? "bad" : "ok") +
      statCard("Collection rate", rate + "%", "Collected vs expected") +
      statCard("Payments", String(inMonth.length), "This month") +
    "</div>" +

    '<div class="section-head"><h2>Last six months</h2></div>' +
    '<div class="card pad">' + chart + "</div>" +

    '<div class="section-head"><h2>How fees were paid</h2></div>' +
    '<div class="card pad">' + PAYMENT_METHODS.map(m =>
      '<div class="bar-row"><span class="lbl">' + esc(m) + '</span><span class="bar-track"><span class="bar-fill" style="width:' +
      Math.round(((byMethod[m] || 0) / maxM) * 100) + '%"></span></span><span class="amt">' + money(byMethod[m] || 0) + "</span></div>").join("") +
      (collected ? "" : '<div class="tiny muted center" style="padding-top:6px">No payments recorded in this month.</div>') + "</div>" +

    '<div class="section-head"><h2>New admissions</h2><span class="link">' + joined.length + "</span></div>" +
    (joined.length
      ? '<div class="rows">' + joined.map(s => {
          const r = calculateStudentStatus(s);
          return '<button class="rowitem" data-act="profile" data-id="' + s.id + '">' + avatarOf(s) +
            '<span class="t"><b>' + esc(s.name) + "</b><span>Joined " + fmtDate(s.joiningDate) + " · " + esc(prettyPhone(s.whatsapp)) + "</span></span>" +
            '<span style="text-align:right"><b class="num">' + money(s.monthlyFee) + "</b>" +
            '<span class="tiny faint" style="display:block">' + esc((STATUS_META[r.status] || {}).text || "") + "</span></span></button>";
        }).join("") + "</div>"
      : '<div class="card pad center muted sm">No students joined in ' + esc(monthLabel(mk)) + ".</div>") +

    '<div class="section-head"><h2>Payments this month</h2><span class="link">' + inMonth.length + "</span></div>" +
    (inMonth.length
      ? '<div class="rows">' + inMonth.slice().sort(byPaymentDateDesc).map(paymentRow).join("") + "</div>"
      : '<div class="card pad center muted sm">Nothing collected in ' + esc(monthLabel(mk)) + ".</div>") +
    '<button class="btn btn-ghost btn-block" style="margin-top:14px" data-act="export-payments-csv">' + I.down + " Export payments as CSV</button>";

  paint(html);
  $("#rMonth").addEventListener("change", function () { UI.reportMonth = this.value; render(); });
}
function monthOptions() {
  const set = new Set([currentMonthKey(), UI.reportMonth]);
  getPayments().forEach(p => set.add(monthKeyOf(p.paymentDate)));
  getStudents().forEach(s => set.add(monthKeyOf(s.joiningDate)));
  const cur = currentMonthKey();
  for (let i = 1; i <= 11; i++) set.add(monthKeyAdd(cur, -i));
  return Array.from(set).filter(Boolean).sort().reverse();
}

function screenNotifications() {
  const t = todayISO();
  const all = computeAll();
  const buckets = [
    { title: "Overdue", rows: all.filter(r => r.nextDueDate < t && r.currentPeriodBalance > 0).sort((a, b) => a.nextDueDate.localeCompare(b.nextDueDate)) },
    { title: "Due today", rows: all.filter(r => r.nextDueDate === t && r.currentPeriodBalance > 0) },
    { title: "Due within 3 days", rows: all.filter(r => r.nextDueDate > t && daysBetween(t, r.nextDueDate) <= 3) },
    { title: "Due within 7 days", rows: all.filter(r => r.nextDueDate > t && daysBetween(t, r.nextDueDate) > 3 && daysBetween(t, r.nextDueDate) <= 7) }
  ];
  const total = buckets.reduce((s, b) => s + b.rows.length, 0);
  renderTopbar({ backTo: "more", backLabel: "More", title: "Reminders", note: total + " to look at, as of " + fmtDate(t) });

  let html = '<div class="alert warn" style="margin-bottom:14px"><div>' + I.clock + '</div><div><div class="t">Reminders are worked out when you open the app</div>' +
    '<div class="b">This app runs entirely on your device, so it cannot send messages on its own or notify you while it is closed.</div></div></div>';

  if (!total) {
    html += emptyState(I.checkCircle, "Nothing to chase", "No fees are due in the next seven days.");
  } else {
    buckets.forEach(b => {
      if (!b.rows.length) return;
      html += '<div class="section-head"><h2>' + esc(b.title) + '</h2><span class="link">' + b.rows.length + "</span></div>" +
        '<div class="rows">' + b.rows.map(r =>
          '<div class="rowitem"><span class="ic">' + I.bell + "</span>" +
          '<span class="t"><b>' + esc(r.student.name) + "</b><span>" + esc(monthLabel(r.currentPeriod)) + " · " + money(r.currentPeriodBalance || r.fee) + " · due " + fmtDate(r.nextDueDate) +
          (r.daysOverdue ? " · " + plural(r.daysOverdue, "day") + " late" : "") + "</span></span>" +
          '<button class="btn btn-wa btn-sm" data-act="remind" data-id="' + r.student.id + '" aria-label="Send WhatsApp reminder">' + I.wa + "</button></div>").join("") + "</div>";
    });
    html += '<button class="btn btn-primary btn-block" style="margin-top:16px" data-act="go-due">Open due & overdue</button>';
  }
  paint(html);
}
