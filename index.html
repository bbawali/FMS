    '<div class="card pad">' +
      '<div style="font-weight:640;margin-bottom:4px">Spreadsheet exports</div>' +
      '<p class="sm muted" style="margin:0 0 12px">CSV files that open cleanly in Excel and Google Sheets.</p>' +
      '<div class="btn-row"><button class="btn" data-act="export-students-csv">' + I.file + " Students</button>" +
      '<button class="btn" data-act="export-payments-csv">' + I.file + " Payments</button></div>" +
    "</div>";
  paint(html);
  const file = $("#restoreFile");
  $("#restoreBtn").addEventListener("click", () => file.click());
  file.addEventListener("change", function () {
    const f = file.files && file.files[0];
    if (!f) return;
    const reader = new FileReader();
    reader.onload = function () { handleRestore(String(reader.result)); file.value = ""; };
    reader.onerror = function () { toast("Could not read that file.", "bad"); };
    reader.readAsText(f);
  });
}

function exportBackup() {
  const data = {
    app: "Shikshayatan",
    version: APP.version,
    exportedAt: new Date().toISOString(),
    students: getStudents(),
    payments: getPayments(),
    settings: getSettings(),
    metadata: getMeta()
  };
  downloadFile("shikshayatan-backup-" + todayISO() + ".json", JSON.stringify(data, null, 2), "application/json");
  const m = getMeta(); m.lastBackupAt = new Date().toISOString(); saveMeta(m);
  toast("Backup exported.");
  if (UI.screen === "backup") render();
}

function handleRestore(text) {
  let data;
  try { data = JSON.parse(text); }
  catch (e) { toast("That file isn't valid JSON.", "bad"); return; }
  if (!data || !Array.isArray(data.students) || !Array.isArray(data.payments)) {
    toast("That doesn't look like a Shikshayatan backup.", "bad"); return;
  }
  const badStudent = data.students.find(s => !s || !s.id || !s.name || !isValidISO(s.joiningDate));
  if (badStudent) { toast("The backup has a student record that isn't readable.", "bad"); return; }
  const badPayment = data.payments.find(p => !p || !p.id || !p.studentId || !isValidISO(p.paymentDate));
  if (badPayment) { toast("The backup has a payment record that isn't readable.", "bad"); return; }

  confirmDialog({
    title: "Restore this backup?",
    tone: "danger",
    warnTitle: "Everything on this device will be replaced",
    warning: "Your current " + plural(getStudents().length, "student") + " and " + plural(getPayments().length, "payment") + " will be overwritten.",
    messageHtml: "The backup contains <b>" + data.students.length + " students</b> and <b>" + data.payments.length + " payments</b>" +
      (data.exportedAt ? ", exported on " + fmtDate(data.exportedAt.slice(0, 10)) : "") + ".",
    confirmText: "Replace my data",
    onConfirm: function () {
      saveStudents(data.students);
      savePayments(data.payments);
      if (data.settings) {
        const merged = Object.assign({}, DEFAULT_SETTINGS, data.settings);
        merged.templates = Object.assign({}, DEFAULT_SETTINGS.templates, data.settings.templates || {});
        saveSettings(merged);
      }
      if (data.metadata) saveMeta(Object.assign({}, getMeta(), data.metadata));
      applyTheme();
      toast("Backup restored.");
      go("dashboard");
    }
  });
}

function csvCell(v) {
  const s = String(v == null ? "" : v);
  return /[",\n]/.test(s) ? '"' + s.replace(/"/g, '""') + '"' : s;
}
function toCSV(rows) { return rows.map(r => r.map(csvCell).join(",")).join("\r\n"); }
function downloadFile(filename, content, mime) {
  const blob = new Blob([mime.indexOf("csv") > -1 ? "\uFEFF" + content : content], { type: mime + ";charset=utf-8" });
  const url = URL.createObjectURL(blob);
  const a = document.createElement("a");
  a.href = url; a.download = filename;
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(url), 1500);
}
function exportStudentsCSV() {
  const rows = [["Name", "WhatsApp", "Joining Date", "Monthly Fee", "Parent/Guardian", "Class", "School", "Address", "Notes", "Status", "Next Due Date", "Outstanding", "Total Paid", "Payments"]];
  computeAll().forEach(r => {
    const s = r.student;
    rows.push([s.name, prettyPhone(s.whatsapp), s.joiningDate, s.monthlyFee, s.parentName || "", s.className || "", s.school || "",
      s.address || "", s.notes || "", (STATUS_META[r.status] || {}).text || r.status, r.nextDueDate, r.outstanding, r.totalPaid, r.paymentCount]);
  });
  downloadFile("shikshayatan-students-" + todayISO() + ".csv", toCSV(rows), "text/csv");
  toast("Students exported.");
}
function exportPaymentsCSV(subset) {
  const rows = [["Receipt No", "Student", "WhatsApp", "Fee Period", "Payment Date", "Amount", "Method", "Notes"]];
  (subset || getPayments().slice().sort(byPaymentDateDesc)).forEach(p => {
    const s = getStudent(p.studentId);
    rows.push([p.receiptNumber || "", s ? s.name : "Deleted student", s ? prettyPhone(s.whatsapp) : "",
      monthLabel(p.feePeriod), p.paymentDate, p.amount, p.paymentMethod || "", p.notes || ""]);
  });
  downloadFile("shikshayatan-payments-" + todayISO() + ".csv", toCSV(rows), "text/csv");
  toast("Payments exported.");
}
function clearAllData() {
  confirmDialog({
    title: "Clear all data?",
    tone: "danger",
    warnTitle: "This erases every student and payment",
    warning: "There is no undo. Export a backup first if you might need this data again.",
    message: "All " + plural(getStudents().length, "student") + " and " + plural(getPayments().length, "payment") + " will be removed from this device.",
    confirmText: "Erase everything",
    onConfirm: function () {
      saveStudents([]); savePayments([]);
      const m = getMeta(); m.receiptCounter = 0; saveMeta(m);
      toast("All data cleared.");
      go("dashboard");
    }
  });
}

/* ================================================================
   12. EVENT HANDLERS & APP INIT
   ================================================================ */
const ACTIONS = {
  "add-student": openAddStudent,
  "collect-picker": openCollectPicker,
  "go-due": () => go("due"),
  "go-students": () => go("students"),
  "go-payments": () => go("payments"),
  "go-reports": () => go("reports"),
  "go-backup": () => go("backup"),
  "go-settings": () => go("settings"),
  "go-notifications": () => go("notifications"),
  "profile": id => openProfile(id),
  "collect": id => { closeAllSheets(); openCollect(id); },
  "remind": id => sendReminder(id),
  "edit-student": id => openEditStudent(id),
  "delete-student": id => deleteStudent(id),
  "joining-msg": id => showJoiningConfirmation(id),
  "wa-open": id => { const s = getStudent(id); if (s) whatsappPreview({ number: s.whatsapp, to: s.name, title: "Message " + s.name, message: "Dear " + (s.parentName || "Parent/Guardian") + ",\n\n" }); },
  "payment-detail": id => openPaymentDetail(id),
  "edit-payment": id => { closeAllSheets(); openEditPayment(id); },
  "delete-payment": id => deletePayment(id),
  "view-receipt": rn => { closeAllSheets(); showReceipt(rn); },
  "wa-receipt": rn => { const d = receiptData(rn); if (d) whatsappPreview({ number: d.student.whatsapp, to: d.student.name, title: "Send receipt", message: receiptMessage(d) }); },
  "clear-search": () => { UI.search = ""; render(); },
  "clear-payfilter": () => { UI.payFilter = { month: "", method: "all", studentId: "", from: "", to: "" }; render(); },
  "filter": id => { UI.filter = id; UI.listLimit = 60; render(); },
  "more-list": () => { UI.listLimit += 60; render(); },
  "sort-menu": openSortMenu,
  "export-backup": exportBackup,
  "export-students-csv": exportStudentsCSV,
  "export-payments-csv": () => exportPaymentsCSV(),
  "export-filtered-csv": () => exportPaymentsCSV(filteredPayments()),
  "save-settings": saveSettingsFromForm,
  "reset-templates": () => {
    confirmDialog({
      title: "Reset message templates?",
      message: "The joining, reminder and receipt templates go back to their original wording.",
      confirmText: "Reset templates",
      onConfirm: () => { const st = getSettings(); st.templates = JSON.parse(JSON.stringify(DEFAULT_SETTINGS.templates)); saveSettings(st); toast("Templates reset."); render(); }
    });
  },
  "clear-all": clearAllData
};

function openSortMenu() {
  openSheet({
    title: "Sort students",
    body: '<div class="rows">' + SORTS.map(s =>
      '<button class="rowitem" data-sort="' + s.id + '"><span class="t"><b>' + esc(s.label) + "</b></span>" +
      (UI.sort === s.id ? '<span style="color:var(--ok)">' + I.check + "</span>" : "") + "</button>").join("") + "</div>",
    onMount: function (sheet) {
      $$("[data-sort]", sheet).forEach(b => b.addEventListener("click", function () {
        UI.sort = b.dataset.sort; closeSheet(); render();
      }));
    }
  });
}

document.addEventListener("click", function (e) {
  const el = e.target.closest("[data-act]");
  if (!el) return;
  const act = el.dataset.act;
  const fn = ACTIONS[act];
  if (!fn) return;
  e.preventDefault();
  fn(el.dataset.id);
});

document.addEventListener("keydown", function (e) {
  if (e.key === "Escape" && UI.sheetStack.length) closeSheet();
});

/* Recalculate when the app comes back into view — the date may have changed. */
document.addEventListener("visibilitychange", function () {
  if (!document.hidden && !UI.sheetStack.length) render();
});

function seedIfFirstRun() {
  // No demo data is created. First run simply establishes the metadata record.
  if (!localStorage.getItem(APP.keys.metadata)) {
    saveMeta({ receiptCounter: 0, createdAt: new Date().toISOString(), lastBackupAt: null, version: APP.version });
  }
}

function init() {
  try {
    seedIfFirstRun();
    applyTheme();
    render();
  } catch (err) {
    console.error(err);
    document.getElementById("screen").innerHTML =
      '<div class="card pad"><h3>Something went wrong while loading</h3><p class="sm muted">' + esc(String(err && err.message || err)) +
      '</p><p class="sm muted">Your saved data has not been touched. Try reloading the page.</p></div>';
  }
}
init();
</script>
